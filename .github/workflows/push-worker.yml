name: Deploy rest-alert worker
on:
  push:
    branches: [main]
    paths: ['push-worker/**', '.github/workflows/push-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: push-worker
          secrets: |
            VAPID_PRIVATE_KEY
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
