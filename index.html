<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stacked">
<meta name="theme-color" content="#10215f">
<title>Stacked</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--top:#14297a;--mid:#0c1750;--bot:#060920;--cy:#5fd0f3;--pk:#ec3a6e;--text:#fff;--mute:#8e9ac6;--line:rgba(255,255,255,.09);--panel:rgba(5,9,35,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bot);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bgfx{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--top) 0%,var(--mid) 45%,var(--bot) 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input,textarea{font:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.i{width:22px;height:22px;flex:none;vertical-align:middle}
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:rgba(20,41,122,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hd h1{flex:1;text-align:center;margin:0;font-size:17px;font-weight:600}
.hd .st{display:block;font-size:11px;font-weight:600;color:var(--pk);letter-spacing:.06em;margin-top:2px}
.hl,.hr{min-width:70px;display:flex;align-items:center}.hr{justify-content:flex-end}
.lnk{color:var(--cy);font-weight:600;font-size:16px}
.pg{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.h2{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;padding:22px 20px 12px;border-bottom:1px solid var(--line)}
.h2 small{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.06em}
.li{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.li .g{flex:1;min-width:0}.li .tt{font-size:16px}.li .sb{font-size:12px;color:var(--mute);margin-top:2px}
.li .chev{color:var(--mute)}
.cyl{display:flex;align-items:center;gap:10px;padding:16px 20px;color:var(--cy);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pkb{display:block;width:calc(100% - 40px);margin:22px 20px 0;padding:15px;background:var(--pk);color:#fff;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;text-align:center}
.olb{display:block;width:calc(100% - 40px);margin:12px 20px 0;padding:14px;border:1.5px solid var(--cy);color:var(--cy);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;text-align:center}
.dng{display:block;margin:22px auto 0;color:var(--pk);font-weight:600;font-size:14px}
.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:12px}.center{text-align:center}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;color:#fff;background:var(--pk);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.tagc{font-size:11px;color:var(--mute);margin-left:6px;text-transform:capitalize}
.empty{text-align:center;color:var(--mute);padding:36px 24px}
.greet{display:flex;align-items:center;justify-content:center;gap:12px;font-size:21px;padding:calc(env(safe-area-inset-top) + 18px) 16px 6px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pk),#7b2cbf);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.resume{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:14px 16px;background:rgba(236,58,110,.16);border:1px solid rgba(236,58,110,.5);border-radius:8px;cursor:pointer}
.resume b{color:var(--pk);font-size:13px;letter-spacing:.06em}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;max-width:520px;margin:0 auto;display:flex;align-items:flex-end;background:#080c2c;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabs>button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mute);padding:4px 0}
.tabs>button.on{color:#fff}
.tabs .fab{width:52px;height:52px;flex:none;margin:0 6px 2px;border-radius:50%;background:var(--pk);color:#fff;box-shadow:0 6px 18px rgba(236,58,110,.45);display:flex;align-items:center;justify-content:center}
.tabs .fab .i{width:28px;height:28px}
.inp{width:100%;background:rgba(5,9,35,.55);border:1px solid var(--line);color:#fff;border-radius:6px;padding:12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--cy)}.inp.big{font-size:30px;text-align:center;font-weight:300}
textarea.inp{font-size:12px;font-family:ui-monospace,Menlo,monospace}
.tog{width:50px;height:30px;border-radius:999px;background:#2b3466;position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--pk)}.tog.on::after{left:23px}
.seg{display:flex;border:1.5px solid var(--cy);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;font-size:13px;font-weight:600;color:var(--cy)}
.seg button.on{background:var(--cy);color:#0a1442}
.stp{display:flex;align-items:center;gap:6px;color:var(--cy)}
.stp button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--cy)}
.stp span{min-width:28px;text-align:center;font-size:17px;color:#fff}
.stp.w span{min-width:66px;font-size:15px}
.ico{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;margin:4px 20px 0}
.stats>div{display:flex;gap:12px;align-items:flex-start;padding:20px 8px}
.stats>div:nth-child(1),.stats>div:nth-child(2){border-bottom:1px dashed rgba(255,255,255,.18)}
.stats>div:nth-child(odd){border-right:1px dashed rgba(255,255,255,.18)}
.stats .i{width:34px;height:34px;color:var(--cy);margin-top:4px}
.stats b{display:block;font-size:36px;font-weight:300;color:#cfefff;line-height:1}
.stats b small{font-size:13px;color:var(--mute)}
.stats span{font-size:11px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.wcard{margin:12px 16px 0;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.wcard .row{display:flex;align-items:center}
.ws{display:flex;margin-top:10px}.ws>div{flex:1}.ws b{display:block;font-size:24px;font-weight:300;color:#cfefff}.ws span{font-size:10px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.spark{width:100%;height:70px;margin-top:10px;display:block}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);font-size:15px}
.setrow span:first-child{font-size:12px;color:var(--mute);letter-spacing:.06em}
/* sheets */
.shwrap{position:fixed;inset:0;z-index:50}
.shbg{position:absolute;inset:0;background:rgba(0,0,10,.65);opacity:0;transition:.2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#17307f,#0c1648);border-radius:16px 16px 0 0;padding:8px 0 calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.shwrap.in .shbg{opacity:1}.shwrap.in .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sh-t{font-weight:700;font-size:18px;padding:6px 20px 12px}
.shp{padding:0 20px}
.plist{max-height:48vh;overflow:auto;border-top:1px solid var(--line);margin-top:10px}
/* session */
.setscr{text-align:center;padding:calc(env(safe-area-inset-top) + 6px) 0 calc(40px + env(safe-area-inset-bottom))}
.setscr .setmain{margin-top:calc(-6px - env(safe-area-inset-top));padding-top:calc(env(safe-area-inset-top) + 6px)}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px}
.topbar>:first-child{justify-self:start}.topbar>:last-child{justify-self:end}
.topbar button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.topbar .i{width:26px;height:26px}
.exn{font-size:24px;font-weight:600;margin-top:2px;padding:0 16px}
.setl{color:var(--pk);font-weight:700;font-size:16px;letter-spacing:.06em;margin-top:6px}
.done-t{font-size:12px;color:#7ee2a8;margin-top:4px;letter-spacing:.04em}
.done-t u{color:var(--mute);cursor:pointer}
.wnum{font-size:66px;font-weight:200;line-height:1;margin-top:18px;cursor:pointer;letter-spacing:-.01em}
.wunit{font-size:12px;color:var(--mute);letter-spacing:.1em;margin-top:4px}
.wsub{font-size:12px;color:var(--mute);margin-top:4px}
.barsvg{width:100%;max-width:420px;display:block;margin:4px auto 0}
.barlbl{font-size:15px;color:#dfe6ff;cursor:pointer;margin-top:-6px}
.plates{display:flex;justify-content:center;align-items:center;gap:10px;margin:18px 10px 0;flex-wrap:wrap}
.oct{position:relative;display:block}
.oct svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 6px rgba(95,208,243,.35))}
.badge{position:absolute;right:-2px;bottom:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--pk);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.hint{font-size:11px;color:var(--mute);margin-top:10px}
.repsrow{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:26px}
.cbtn{width:56px;height:56px;border-radius:50%;border:2px solid var(--cy);color:var(--cy);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(95,208,243,.25)}
.cbtn .i{width:24px;height:24px}
.rnum{font-size:66px;font-weight:200;line-height:1;min-width:90px;cursor:pointer}
.navrow{display:flex;align-items:center;justify-content:space-between;padding:0 34px;margin-top:30px}
.navrow .dbl{width:56px;height:56px;color:var(--pk);display:flex;align-items:center;justify-content:center}
.navrow .dbl .i{width:40px;height:40px}
.rtb{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--cy);font-size:11px;letter-spacing:.06em}
.rtb .i{width:30px;height:30px}
.rtb.run{color:var(--pk);font-size:20px;font-weight:600;letter-spacing:0}
.lw{margin-top:30px;text-align:left;border-top:1px solid var(--line)}
.lwh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.lwh b{font-size:18px}.lwh span{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.lwh .i{width:18px;height:18px}
.ovbar{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:8;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#1a2152;cursor:pointer}
.ovbar .i{width:34px;height:34px;color:var(--pk)}
.ovbar .g{flex:1}.ovbar .g div:last-child{font-size:13px;color:var(--mute)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,5,20,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.tcard{position:relative;width:100%;max-width:360px;background:linear-gradient(180deg,#1b3388,#0f1c58);border-radius:10px;overflow:hidden;text-align:center;padding-top:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tcard .x{position:absolute;right:10px;top:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff}
.tcard h3{margin:0;font-size:17px;font-weight:600}
.ring{position:relative;width:200px;height:200px;margin:26px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:300;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.adj{display:flex;margin:10px 0 22px}.adj button{flex:1;font-size:28px;font-weight:300;padding:10px}.adj button small{font-size:12px;color:var(--mute)}
.adj button:first-child{border-right:1px solid var(--line)}
.tcard .pkb{margin:0;width:100%;border-radius:0}
.calcscr{position:fixed;inset:0;z-index:45;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.calcscr .bgfx{position:absolute}
.cin{display:flex;background:rgba(5,9,35,.6)}
.cin label{flex:1;display:flex;align-items:center;gap:10px;padding:20px 16px;color:var(--mute);font-size:13px;letter-spacing:.05em}
.cin label:first-child{border-right:1px solid var(--line)}
.cin input{flex:1;min-width:0;background:none;border:0;color:#fff;font-size:22px;outline:none}
.cin .i{color:var(--pk)}
.crows{flex:1;overflow:auto}
.crow{display:flex;padding:15px 0;border-bottom:1px solid var(--line);font-size:16px}
.crow span{flex:1;text-align:center}.crow span:last-child{color:#dfe6ff}
.calcscr .pkb{margin:12px 20px calc(16px + env(safe-area-inset-bottom))}
.setpanel{position:fixed;inset:0;z-index:20;max-width:520px;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,var(--top) 0%,var(--mid) 45%,var(--bot) 100%);box-shadow:0 -10px 40px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
.setpanel.enter{animation:slideUp .34s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.grab2{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:4px auto 0}
.ovbar.ins{bottom:calc(64px + env(safe-area-inset-bottom));padding-bottom:12px}
.push{animation:pushIn .26s cubic-bezier(.2,.8,.2,1)}
.pop{animation:popIn .26s cubic-bezier(.2,.8,.2,1)}
.fade{animation:fadeIn .2s ease}
@keyframes pushIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.setmain{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.setscr .mid{flex:1 0 auto;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(10px,2vh,24px);padding:clamp(6px,1.5vh,16px) 0}
.setscr .exn{font-size:clamp(22px,3.4vh,30px);font-weight:700;line-height:1.15}
.setscr .setl{font-size:clamp(16px,2.4vh,20px);margin-top:6px}
.setscr .wnum{font-size:clamp(58px,10vh,108px);font-weight:200;margin-top:0;line-height:.95}
.setscr .wunit{font-size:14px;letter-spacing:.14em;margin-top:10px;padding-left:.14em}
.setscr .barsvg{width:100%;height:auto;max-height:clamp(96px,17vh,160px);padding:0 4px}
.bp{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:opacity .22s ease,transform .22s cubic-bezier(.4,0,.2,1)}
.bp:active{opacity:.8}
.bp.out{opacity:0;transform:scaleY(.6)}
.bp.out rect{fill:#f27ea0}
.setscr .barlbl{font-size:17px}
.setscr .hint{font-size:11px;margin-top:6px}
.setscr .repsrow{margin-top:0;gap:30px}
.setscr .rnum{font-size:clamp(52px,8.5vh,88px);min-width:120px}
.setscr .cbtn{width:clamp(56px,7.5vh,68px);height:clamp(56px,7.5vh,68px)}.setscr .cbtn .i{width:30px;height:30px}
.setscr .navrow{flex:none;margin-top:4px;padding:0 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.setscr .navrow .dbl:first-child{justify-self:start}.setscr .navrow .dbl:last-child{justify-self:end}
.setscr .navrow .dbl{width:88px;height:72px;border-radius:16px}.setscr .navrow .dbl .i{width:60px;height:60px}
.setscr .navrow .dbl:active,.cbtn:active,.oct:active{transform:scale(.92)}
.setscr .rtb{font-size:12px}.setscr .rtb .i{width:40px;height:40px}.setscr .rtb.run{font-size:26px}
.setscr .plates{flex-wrap:nowrap;gap:8px;margin:8px 0 0;padding:0 14px}
.oct{--b:min(84px,calc((min(100vw,520px) - 20px - 8px * var(--n)) / (var(--n) * .8)),10.5vh);flex:none;width:calc(var(--b) * var(--k));height:calc(var(--b) * var(--k));transition:transform .1s}
.setscr .lw{margin-top:0}
.stick{position:sticky;top:-8px;z-index:2;background:#17307f;padding-top:4px;padding-bottom:4px}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(95,208,243,.45);color:var(--cy);font-size:13px;font-weight:600;text-transform:capitalize;white-space:nowrap}
.chips2 button.on{background:var(--cy);color:#0a1442;border-color:var(--cy)}
.secl{padding:18px 20px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pk);border-bottom:1px solid var(--line)}
.letter{padding:8px 20px 4px;font-size:13px;font-weight:700;color:var(--mute);background:rgba(5,9,35,.35)}
.lblx{font-size:12px;color:var(--mute);margin:12px 2px 6px}
select.inp{-webkit-appearance:none;appearance:none}
textarea.inp.notes{font-size:15px;font-family:inherit;resize:vertical;line-height:1.4}
.tnote{white-space:pre-wrap;font-size:14px;color:#dfe6ff;background:rgba(95,208,243,.08);border-left:3px solid var(--cy);border-radius:4px;padding:10px 12px;margin-bottom:10px}
.wub{width:auto!important;padding:0 8px;color:var(--cy)!important;font-size:9.5px;font-weight:700;letter-spacing:.08em;border:1px solid rgba(95,208,243,.4);border-radius:999px;height:22px!important;opacity:.85}
.sstag{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--pk);border:1px solid rgba(236,58,110,.6);border-radius:999px;padding:3px 10px}
.sstag.sm2{margin-top:2px;font-size:9px;padding:1px 6px}
.hintp{display:inline-flex;align-items:center;gap:8px;margin:10px auto 0;max-width:calc(100% - 32px);padding:7px 8px 7px 12px;border-radius:999px;background:rgba(46,204,113,.12);border:1px solid rgba(46,204,113,.5);color:#bff3d4;font-size:12.5px;text-align:left}
.hintp .i{width:16px;height:16px;color:#5fe39a}.hintp b{flex:none;background:#2ecc71;color:#06210f;font-size:11px;letter-spacing:.06em;border-radius:999px;padding:4px 10px}
.ico.lon{color:var(--pk)}
.bkb{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:12px 10px 12px 14px;background:rgba(95,208,243,.1);border:1px solid rgba(95,208,243,.4);border-radius:8px}
.bkb .g{flex:1}.bkb b{font-size:14px}
.strk{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.strk>div{position:relative;padding:12px 6px 14px;text-align:center}.strk>div+div{border-left:1px solid var(--line)}
.strk b{display:block;font-size:26px;font-weight:300;color:#cfefff}.strk b small{font-size:14px;color:var(--mute)}.strk span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.strk i{position:absolute;left:14px;right:14px;bottom:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.1)}.strk i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p);background:var(--pk);border-radius:2px}
.cal{margin:12px 16px 0;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.calh button{color:var(--cy);display:flex;padding:4px}.calh b{font-size:15px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}

const MGS=Object.keys(PAT);
const LIB=(()=>{const out=[],seen=new Set();LIBTXT.split('\n').forEach(line=>{const [mg,rest]=line.split('|');rest.split(';').forEach(t=>{let [n,eq]=t.split(':');const pop=n[0]==='*';if(pop)n=n.slice(1);if(seen.has(n.toLowerCase()))return;seen.add(n.toLowerCase());out.push({name:n,eq,mg,pat:PAT[mg],pop,type:EQT[eq]})})});return out})();
function mergeLib(){
  const ren={'Leg Curl':'Lying Leg Curl','Calf Raise':'Standing Calf Raise','Dip':'Triceps Dip'};
  S.exercises.forEach(e=>{if(ren[e.name]&&!S.exercises.some(z=>z.name===ren[e.name]))e.name=ren[e.name]});

  for(const l of LIB){const e=by[l.name.toLowerCase()];if(e)Object.assign(e,{eq:l.eq,mg:l.mg,pat:l.pat,pop:l.pop,type:l.type});else S.exercises.push(Object.assign({id:uid()},l))}
  S.libv=LIBV;
}
function seed(){

  const f=n=>ex.find(e=>e.name===n).id, it=(n,s)=>({exId:f(n),sets:s});
  return {v:2,name:'Liam',units:'lb',rest:120,autoRest:false,m1:1,bar:{lb:45,kg:20},dbMode:'per',libv:LIBV,body:[],weekGoal:3,exercises:ex,
    routines:[{id:uid(),name:'Sample 3-Day Split',active:true,days:[
      {id:uid(),name:'Push',items:[it('Barbell Bench Press',3),it('Incline Dumbbell Press',3),it('Overhead Press',3),it('Tricep Pushdown',3)]},
      {id:uid(),name:'Pull',items:[it('Deadlift',3),it('Barbell Row',3),it('Lat Pulldown',3),it('Barbell Curl',3)]},
      {id:uid(),name:'Legs',items:[it('Barbell Back Squat',3),it('Romanian Deadlift',3),it('Leg Press',3),it('Standing Calf Raise',3)]}]}],

function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||seed();
if(!S.m1){S.autoRest=false;S.m1=1}
if(S.libv!==LIBV){mergeLib();save()}
if(!S.body)S.body=[];if(!S.weekGoal)S.weekGoal=3;
let V={tab:'home',sub:null,stack:[],inSession:!!S.session,ov:false,ovEdit:false,restOpen:false,calc:null,rEdit:false};

const U=()=>S.units;
const PLATES={lb:[45,35,25,10,5,2.5],kg:[25,20,15,10,5,2.5,1.25]};
const step=()=>U()==='lb'?5:2.5;
const ex=id=>S.exercises.find(e=>e.id===id)||{id,name:'(deleted exercise)',type:'machine'};
const bar=()=>S.bar[U()];
const e1=(w,r)=>r<=0?0:r===1?w:w*(1+r/30);
const vf=t=>t==='dumbbell'&&S.dbMode==='per'?2:1;
const R=id=>S.routines.find(r=>r.id===id);
const D=(ri,di)=>R(ri).days.find(d=>d.id===di);
const cur=()=>{const s=S.session;return s.items[s.i].sets[s.s]};
const dn=e=>e.sets.filter(x=>!x.skip&&!x.wu);
const mu=()=>U()==='lb'?'in':'cm';
const ulab=()=>U()==='lb'?'LBS':'KG';

function greedy(side){const out=[];let rem=Math.round(side*100)/100;for(const p of PLATES[U()]){while(rem>=p-1e-9){out.push(p);rem=Math.round((rem-p)*100)/100}}return out}
function lastFor(exId){for(const h of S.history){const e=h.entries.find(x=>x.exId===exId);if(e)return{date:h.date,sets:e.sets}}return null}
function bests(exId){const b={w:0,wr:0,e:0,reps:0,n:0};for(const h of S.history){const e=h.entries.find(x=>x.exId===exId);if(!e||!dn(e).length)continue;b.n++;for(const s of dn(e)){if(s.w>b.w||(s.w===b.w&&s.r>b.wr)){b.w=s.w;b.wr=s.r}const v=e1(s.w,s.r);if(v>b.e)b.e=v;if(s.r>b.reps)b.reps=s.r}}return b}
function volOf(h){return h.entries.reduce((a,e)=>{const t=ex(e.exId).type;return a+dn(e).reduce((b,x)=>b+x.w*x.r*vf(t),0)},0)}

function mkItem(exId,n,sn){const last=lastFor(exId),t=ex(exId).type,sets=[];const wl=last?last.sets.filter(x=>!x.wu):[],ld=wl.filter(x=>!x.skip);for(let j=0;j<n;j++){let ls=wl[j]&&!wl[j].skip?wl[j]:(ld.length?ld[Math.min(j,ld.length-1)]:null);sets.push({w:ls?ls.w:(t==='barbell'?bar():0),r:ls?ls.r:8,done:false})}return{exId,sets,sn:!!sn}}

function startWorkout(rid,did){
  closeSheet();
  if(S.session){toast('Finish or discard your current workout first');return}
  let name='Workout',items=[];
  if(did){const d=D(rid,did);name=d.name;items=d.items.map(it=>mkItem(it.exId,it.sets,it.sn))}
  S.session={id:uid(),rid:rid||null,did:did||null,name,start:Date.now(),items,i:0,s:0,rest:null};
  V.inSession=true;V.ov=!items.length;V.animIn=true;save();render();V.animIn=false;scrollTo(0,0);
}
function grp(i){const its=S.session.items;let a=i;while(a>0&&its[a-1].sn)a--;let b=i;while(b<its.length-1&&its[b].sn)b++;return [a,b]}

function seqIdx(){const s=S.session;return seqList().findIndex(a=>a[0]===s.i&&a[1]===s.s)}
function move(d){const s=S.session,L=seqList();const k=Math.max(0,Math.min(L.length-1,seqIdx()+d));if(L[k]){s.i=L[k][0];s.s=L[k][1]}}
const isLast=()=>seqIdx()===seqList().length-1;
const inSS=i=>{const its=S.session.items;return !!(its[i]&&(its[i].sn||(i>0&&its[i-1].sn)))};
function setLabel(it,j){const st=it.sets[j];if(st.wu){const w=it.sets.filter(x=>x.wu);return `WARM-UP ${w.indexOf(st)+1}/${w.length}`}const w=it.sets.filter(x=>!x.wu);return `SET ${w.indexOf(st)+1}/${w.length}`}
function incFor(t){return t==='dumbbell'&&U()==='kg'?2:step()}
function overload(it){const e=ex(it.exId);if(it.hintDone)return null;const last=lastFor(it.exId);if(!last)return null;const w=last.sets.filter(x=>!x.wu);if(w.length<1||w.some(x=>x.skip))return null;
  const top=Math.max(...w.map(x=>x.w));if(w.some(x=>x.w!==top))return null;if(w[w.length-1].r<w[0].r-1)return null;
  const work=it.sets.filter(x=>!x.wu&&!x.done);if(!work.length||work.some(x=>x.w!==top))return null;
  if(top===0)return {bw:true,txt:`Hit all ${w.length}×${w[0].r} last time. Go for +1 rep`};
  const inc=incFor(e.type);return {top,inc,txt:`+${fmt(inc)} ${U()}? You hit ${w.length}×${w[0].r} at ${fmt(top)} last time`}}
function wuPlan(w,t){const b=t==='barbell'?bar():0,inc=t==='barbell'?(U()==='lb'?5:2.5):incFor(t);const r=x=>Math.max(b,Math.round(x/inc)*inc);const out=[];if(t==='barbell'&&w>b)out.push({w:b,r:10});
  const heavy=U()==='lb'?225:100,mid=U()==='lb'?135:60;const pct=w>=heavy?[[.4,8],[.6,5],[.75,3],[.85,1]]:w>=mid?[[.5,6],[.7,3],[.85,1]]:[[.5,8],[.75,4]];
  for(const [p,rp] of pct){const x=r(w*p);if(x>0&&x<w&&x>(out.length?out[out.length-1].w:0))out.push({w:x,r:rp})}return out}
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function prTimeline(exId){const out=[];let be=0;for(let k=S.history.length-1;k>=0;k--){const h=S.history[k],e=h.entries.find(x=>x.exId===exId);if(!e)continue;let best=null;for(const x of dn(e)){const v=x.w>0?e1(x.w,x.r):x.r;if(v>be+.01&&(!best||v>best.v))best={v,w:x.w,r:x.r}}if(best){be=best.v;out.push({date:h.date,...best})}}return out}
function restDone(b){const s=S.session;if(!s||!s.rest)return;s.rest=null;V.restOpen=false;if(b)beep();save();if(V.inSession)render()}

function suggest(list){
  const ctx=V.pf.ctx.map(ex),mc={},pc={},use={};
  ctx.forEach(e=>{if(e.mg)mc[e.mg]=(mc[e.mg]||0)+1;if(e.pat)pc[e.pat]=(pc[e.pat]||0)+1});
  S.history.slice(0,40).forEach(h=>h.entries.forEach(e=>use[e.exId]=(use[e.exId]||0)+1));
  const inCtx=new Set(V.pf.ctx);
  const sc=e=>(pc[e.pat]||0)*1.2+(mc[e.mg]||0)*2+(e.pop?1.5:0)+Math.min(3,use[e.id]||0)*(ctx.length?.6:1.5);
  const ranked=list.filter(e=>!inCtx.has(e.id)).map(e=>[sc(e),e]).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]);
  const out=[],per={};for(const [,e] of ranked){if((per[e.mg]||0)>=2)continue;per[e.mg]=(per[e.mg]||0)+1;out.push(e);if(out.length===5)break}
  const top=Object.entries(pc).sort((a,b)=>b[1]-a[1])[0];
  return {list:out,label:top?`Suggested for your ${top[0]} workout`:'Suggested'};
}

  const chips=`<div class="chips2">${eqs.map(k=>`<button class="${f.eq===k?'on':''}" data-a="pfeq" data-x="${k}">${k?EQN[k]:'All equipment'}</button>`).join('')}</div><div class="chips2">${['',...MGS].map(m=>`<button class="${f.mg===m?'on':''}" data-a="pfmg" data-x="${m}">${m||'All muscles'}</button>`).join('')}</div>`;

/* session */
function octBtn(p,count){
  const mx=PLATES[U()][0],sz=Math.round(46+30*Math.sqrt(p/mx));
  const poly=r=>[...Array(8)].map((_,k)=>{const a=Math.PI/8+k*Math.PI/4;return (50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1)}).join(' ');
  return `<button class="oct" style="--k:${(sz/76).toFixed(3)}" data-a="plate" data-x="${p}"><svg viewBox="0 0 100 100"><polygon points="${poly(46)}" fill="rgba(13,26,82,.9)" stroke="var(--cy)" stroke-width="4"/><polygon points="${poly(37)}" fill="none" stroke="var(--cy)" stroke-opacity=".45" stroke-width="2.5"/><text x="50" y="58" text-anchor="middle" font-size="${String(p).length>3?20:26}" fill="#fff" font-family="-apple-system,system-ui,sans-serif">${fmt(p)}</text></svg>${count?`<span class="badge">${count}</span>`:''}</button>`;
}
function barSvg(p){
  const Wd=340,H=140,cy=70,mx=PLATES[U()][0];
  const pw=x=>11+9*Math.sqrt(x/mx),ph=x=>46+88*Math.sqrt(x/mx);

  let g=`<line x1="4" y1="${cy}" x2="${Wd-4}" y2="${cy}" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="108" y="${cy-13}" width="6" height="26" rx="2" fill="#fff"/><rect x="${Wd-114}" y="${cy-13}" width="6" height="26" rx="2" fill="#fff"/><g data-a="editbar" style="cursor:pointer"><rect x="118" y="${cy+8}" width="${Wd-236}" height="40" fill="transparent"/><text x="${Wd/2}" y="${cy+34}" text-anchor="middle" font-size="17" fill="#dfe6ff" font-family="-apple-system,system-ui,sans-serif">${fmt(bar())} ${U()}s</text></g>`;
  let xr=Wd-106,xl=106;
  p.forEach((x,k)=>{const w=pw(x)*sc,h=ph(x);
    g+=`<g data-a="rmplate" data-x="${k}" class="bp"><rect x="${xr-1}" y="0" width="${w+2}" height="${H}" fill="transparent"/><rect x="${xl-w-1}" y="0" width="${w+2}" height="${H}" fill="transparent"/><rect x="${xr}" y="${cy-h/2}" width="${w}" height="${h}" rx="3" fill="#5fd0f3"/><rect x="${xl-w}" y="${cy-h/2}" width="${w}" height="${h}" rx="3" fill="#5fd0f3"/></g>`;xr+=w+2;xl-=w+2});
  return `<svg class="barsvg" viewBox="0 0 ${Wd} ${H}" style="filter:drop-shadow(0 0 6px rgba(95,208,243,.5))">${g}</svg>`;
}

/* upgrades */
function checkPR(it,st){const b=bests(it.exId);if(!b.n)return;const prev=it.sets.filter(x=>x!==st&&x.done&&!x.wu);const pe=Math.max(b.e,...prev.map(x=>e1(x.w,x.r))),pw=Math.max(b.w,...prev.map(x=>x.w)),pr=Math.max(b.reps,...prev.map(x=>x.r));

function streakStrip(){const ws=weekStart(Date.now()),cnt=w=>S.history.filter(h=>h.date>=w&&h.date<w+7*864e5).length;const thisW=cnt(ws);let st=0,w=ws-7*864e5;if(thisW>=S.weekGoal)st=1;while(cnt(w)>=S.weekGoal){st++;w-=7*864e5}
  const m=new Date();m.setDate(1);m.setHours(0,0,0,0);const mon=S.history.filter(h=>h.date>=m.getTime()).length;const pct=Math.min(100,thisW/S.weekGoal*100);

function calendar(){const off=V.calM||0,now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+off,1),y=m.getFullYear(),mo=m.getMonth();const days=new Date(y,mo+1,0).getDate(),lead=(m.getDay()+6)%7;

  let g='';for(let k=0;k<lead;k++)g+='<span></span>';for(let d=1;d<=days;d++){const t=new Date(y,mo,d).getTime(),today=now.getFullYear()===y&&now.getMonth()===mo&&now.getDate()===d;g+=`<button class="${by[d]?'on':''} ${today?'td':''}" ${by[d]?`data-a="calday" data-x="${t}"`:''}>${d}</button>`}

function weekVolume(){const ws=weekStart(Date.now()),lw=ws-7*864e5;const a={},b={};S.history.forEach(h=>{const t=h.date>=ws?a:(h.date>=lw&&h.date<ws?b:null);if(!t)return;h.entries.forEach(e=>{const m=ex(e.exId).mg;if(!m)return;t[m]=(t[m]||0)+dn(e).length})});

  dbm:x=>{S.dbMode=x;RS()},
  export:()=>openSheet(`<div class="sh-t">Backup</div><div class="shp"><p class="sm mute" style="margin-top:0">Copy this text and keep it somewhere safe (Notes, email). Paste it into “Restore from backup” to bring everything back.</p><textarea class="inp" id="bk" rows="6" readonly>${esc(JSON.stringify(S))}</textarea></div><button class="pkb" data-a="copybk">Copy to Clipboard</button>`),
  copybk:()=>{const t=$('#bk').value;const fb=()=>{const b=$('#bk');b.focus();b.select();toast('Select all and copy manually')};try{navigator.clipboard.writeText(t).then(()=>{S.lastBackup=Date.now();save();toast('Backup copied')},fb)}catch(e){fb()}},
  import:()=>openSheet(`<div class="sh-t">Restore from Backup</div><div class="shp"><p class="sm mute" style="margin-top:0">Paste your backup text. This replaces everything currently in the app.</p><textarea class="inp" id="rb" rows="6"></textarea></div><button class="pkb" data-a="dorestore">Restore</button>`),
  dorestore:()=>{try{const o=JSON.parse($('#rb').value);if(!o||!Array.isArray(o.exercises)||!Array.isArray(o.history)||!Array.isArray(o.routines))throw 0;S=o;save();closeSheet();V={tab:'home',sub:null,stack:[],inSession:!!S.session,ov:false,restOpen:false,calc:null};render();toast('Backup restored')}catch(e){toast('That doesn’t look like a valid backup')}},
  reset:()=>confirmSheet('Reset everything? All workouts, routines and settings will be erased.',()=>{S=seed();V={tab:'home',sub:null,stack:[],inSession:false,ov:false,restOpen:false,calc:null};RS()},'Reset'),
};

document.addEventListener('click',e=>{unlockAudio();const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f){e.preventDefault();e.stopPropagation();f(el.dataset.x,el)}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.in;if(!k)return;const x=el.dataset.x;
  if(k==='rname'){R(x).name=el.value;save()}
  else if(k==='dname'){const [ri,di]=x.split('|');D(ri,di).name=el.value;save()}
  else if(k==='dnotes'){const [ri,di]=x.split('|');D(ri,di).notes=el.value;save()}
  else if(k==='snote'){S.session.note=el.value;save()}
  else if(k==='name'){S.name=el.value.trim();save()}
  else if(k==='pq'){V.pf.q=el.value;$('#pl').innerHTML=pickBody()}
  else if(k==='calc'){V.calc={w:$('#cw').value,r:$('#cr').value};$('#crows').innerHTML=calcRows()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='numin')ACT.numok()});

function tick(){const s=S.session;if(!s)return;const t=mmss((Date.now()-s.start)/1000);const el=$('#el');if(el)el.textContent=t;const e2=$('#el2');if(e2)e2.textContent=t;
  if(s.rest){const left=(s.rest.end-Date.now())/1000;if(left<=0){restDone(true);return}const txt=mmss(Math.ceil(left));const rt=$('#rt');if(rt)rt.textContent=txt;const r2=$('#rt2');if(r2)r2.textContent=txt;const rr=$('#rring');if(rr){const C=2*Math.PI*88;rr.setAttribute('stroke-dashoffset',C*(1-left*1000/s.rest.total))}}}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

(function(){try{if(document.querySelector('link[rel=apple-touch-icon]'))return;const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,180);gr.addColorStop(0,'#14297a');gr.addColorStop(1,'#060920');g.fillStyle=gr;g.fillRect(0,0,180,180);g.fillStyle='#ec3a6e';[[34,114,112],[48,82,84],[62,50,56]].forEach(([x,y,w])=>{g.beginPath();if(g.roundRect)g.roundRect(x,y,w,24,5);else g.rect(x,y,w,24);g.fill()});const u=c.toDataURL();const l=document.createElement('link');l.rel='apple-touch-icon';l.href=u;document.head.appendChild(l);const i=document.createElement('link');i.rel='icon';i.href=u;document.head.appendChild(i)}catch(e){}})();
render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
</script>
</body>
