<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bars">
<meta name="theme-color" content="#151517">
<title>Bars</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-bars-180.png">
<link rel="icon" href="icon-bars-192.png">
<style>
:root{--top:#14297a;--mid:#0c1750;--bot:#060920;--cy:#5fd0f3;--pk:#ec3a6e;--text:#fff;--mute:#8e9ac6;--line:rgba(255,255,255,.09);--panel:rgba(var(--deepr),.45);--cyr:95,208,243;--pkr:236,58,110;--deepr:5,9,35;--hdr:var(--hdr);--on-pk:#fff;--on-cy:var(--on-cy);--num:var(--num);--soft:var(--soft);--tabbg:var(--tabbg);--sh1:#17307f;--sh2:#0c1648;--bar2:var(--bar2);--tc1:var(--tc1);--tc2:var(--tc2);--octbg:var(--octbg);--tog:var(--tog);--track:var(--track);--cy2:var(--cy2);--pk2:var(--pk2);--av2:var(--av2);--toastc:#0c1648;--pklt:var(--pklt);--pkup:var(--pkup);--pkfade:var(--pkfade);--modal:var(--modal);--shbg:var(--shbg)}
html[data-theme="volt"]{--top:#161618;--mid:#0d0d0f;--bot:#060607;--cy:#f4f4f5;--pk:#ffd60a;--text:#fff;--mute:#8e8e96;--line:rgba(255,255,255,.08);--panel:rgba(255,255,255,.035);--cyr:244,244,245;--pkr:255,214,10;--deepr:0,0,0;--hdr:rgba(34,34,38,.86);--on-pk:#121212;--on-cy:#121212;--num:#fff;--soft:#e4e4e7;--tabbg:#0b0b0c;--sh1:#28282c;--sh2:#161618;--bar2:#1f1f22;--tc1:#2c2c31;--tc2:#18181b;--octbg:rgba(22,22,24,.92);--tog:#3a3a40;--track:#46464e;--cy2:#a1a1aa;--pk2:#ff9f0a;--av2:#ff9f0a;--toastc:#121212;--pklt:#ffe066;--pkup:#ffe066;--pkfade:#ffe680;--modal:rgba(0,0,0,.72);--shbg:rgba(0,0,0,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bot);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bgfx{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--top) 0%,var(--mid) 45%,var(--bot) 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input,textarea{font:inherit}
#app{max-width:520px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column;min-height:0}
:root{--sab:env(safe-area-inset-bottom);--sat:env(safe-area-inset-top)}
html.sa{--sat:calc(env(safe-area-inset-top) + 36px)}html.fixgap{--sab:max(env(safe-area-inset-bottom),28px)}
html,body{height:var(--fh,100%);overflow:hidden;overscroll-behavior:none}body{position:relative}
#app>.hd{flex:none;position:relative}
#app>main.pg{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.i{width:22px;height:22px;flex:none;vertical-align:middle}
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 12px) 16px 12px;background:var(--bot);border-bottom:1px solid var(--line)}
.sbcover{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--bot);z-index:30;pointer-events:none}
.hd h1{flex:1;text-align:center;margin:0;font-size:17px;font-weight:600}
.hd .st{display:block;font-size:11px;font-weight:600;color:var(--pk);letter-spacing:.06em;margin-top:2px}
.hl,.hr{min-width:70px;display:flex;align-items:center}.hr{justify-content:flex-end}
.lnk{color:var(--cy);font-weight:600;font-size:16px}
.pg{padding-bottom:calc(110px + var(--sab))}
.h2{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;padding:22px 20px 12px;border-bottom:1px solid var(--line)}
.h2 small{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.06em}
.li{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.li .g{flex:1;min-width:0}.li .tt{font-size:16px}.li .sb{font-size:12px;color:var(--mute);margin-top:2px}
.li .chev{color:var(--mute)}
.cyl{display:flex;align-items:center;gap:10px;padding:16px 20px;color:var(--cy);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pkb{display:block;width:calc(100% - 40px);margin:22px 20px 0;padding:15px;background:var(--pk);color:var(--on-pk);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;text-align:center}
.olb{display:block;width:calc(100% - 40px);margin:12px 20px 0;padding:14px;border:1.5px solid var(--cy);color:var(--cy);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;text-align:center}
.dng{display:block;margin:22px auto 0;color:var(--pk);font-weight:600;font-size:14px}
.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:12px}.center{text-align:center}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--on-pk);background:var(--pk);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.tagc{font-size:11px;color:var(--mute);margin-left:6px;text-transform:capitalize}
.empty{text-align:center;color:var(--mute);padding:36px 24px}
.greet{display:flex;align-items:center;justify-content:center;gap:12px;font-size:21px;padding:calc(var(--sat) + 18px) 16px 6px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--av2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--on-pk)}
.resume{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:14px 16px;background:rgba(var(--pkr),.16);border:1px solid rgba(var(--pkr),.5);border-radius:8px;cursor:pointer}
.resume b{color:var(--pk);font-size:13px;letter-spacing:.06em}
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:7;max-width:520px;margin:0 auto;display:flex;align-items:flex-end;background:var(--tabbg);border-top:1px solid var(--line);padding:6px 0 calc(6px + var(--sab))}
.tabs>button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;letter-spacing:-.01em;color:var(--mute);padding:4px 0}
.tabs>button.on{color:#fff}
.tabs .fab{width:52px;height:52px;flex:none;margin:0 10px 2px;border-radius:50%;background:var(--pk);color:var(--on-pk);box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.tabs .fab .i{width:28px;height:28px}
.fablogo{width:34px;height:34px;margin-left:4px}
.inp{width:100%;background:rgba(var(--deepr),.55);border:1px solid var(--line);color:#fff;border-radius:6px;padding:12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--cy)}.inp.big{font-size:30px;text-align:center;font-weight:300}
textarea.inp{font-size:12px;font-family:ui-monospace,Menlo,monospace}
.tog{width:50px;height:30px;border-radius:999px;background:var(--tog);position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--pk)}.tog.on::after{background:var(--on-pk)}.tog.on::after{left:23px}
.seg{display:flex;border:1.5px solid var(--cy);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;font-size:13px;font-weight:600;color:var(--cy)}
.seg button.on{background:var(--cy);color:var(--on-cy)}
.stp{display:flex;align-items:center;gap:6px;color:var(--cy)}
.stp button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--cy)}
.stp span{min-width:28px;text-align:center;font-size:17px;color:#fff}
.stp.w span{min-width:66px;font-size:15px}
.ico{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;margin:4px 20px 0}
.stats>div{display:flex;gap:12px;align-items:flex-start;padding:20px 8px}
.stats>div:nth-child(1),.stats>div:nth-child(2){border-bottom:1px dashed rgba(255,255,255,.18)}
.stats>div:nth-child(odd){border-right:1px dashed rgba(255,255,255,.18)}
.stats .i{width:34px;height:34px;color:var(--cy);margin-top:4px}
.stats b{display:block;font-size:36px;font-weight:300;color:var(--num);line-height:1}
.stats b small{font-size:13px;color:var(--mute)}
.stats span{font-size:11px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.wcard{margin:12px 16px 0;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.wcard .row{display:flex;align-items:center}
.ws{display:flex;margin-top:10px}.ws>div{flex:1}.ws b{display:block;font-size:24px;font-weight:300;color:var(--num)}.ws span{font-size:10px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.spark{width:100%;height:70px;margin-top:10px;display:block}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);font-size:15px}
.setrow span:first-child{font-size:12px;color:var(--mute);letter-spacing:.06em}
/* sheets */
.shwrap{position:absolute;inset:0;z-index:50}
.shbg{position:absolute;inset:0;background:var(--shbg);opacity:0;transition:.2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:linear-gradient(180deg,var(--sh1),var(--sh2));border-radius:16px 16px 0 0;padding:8px 0 calc(20px + var(--sab));max-height:86vh;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.shwrap.in .shbg{opacity:1}.shwrap.in .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sh-t{font-weight:700;font-size:18px;padding:6px 20px 12px}
.shp{padding:0 20px}
.plist{max-height:48vh;overflow:auto;border-top:1px solid var(--line);margin-top:10px}
/* session */
.setscr{text-align:center;padding:calc(var(--sat) + 6px) 0 calc(40px + var(--sab))}
.setscr .setmain{margin-top:calc(-6px - var(--sat));padding-top:calc(var(--sat) + 6px)}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px}
.topbar>:first-child{justify-self:start}.topbar>:last-child{justify-self:end}
.topbar button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.topbar .i{width:26px;height:26px}
.exn{font-size:24px;font-weight:600;margin-top:2px;padding:0 16px}
.setl{color:var(--pk);font-weight:700;font-size:16px;letter-spacing:.06em;margin-top:6px}
.done-t{font-size:12px;color:#7ee2a8;margin-top:4px;letter-spacing:.04em}
.done-t u{color:var(--mute);cursor:pointer}
.wnum{font-size:66px;font-weight:200;line-height:1;margin-top:18px;cursor:pointer;letter-spacing:-.01em}
.wunit{font-size:12px;color:var(--mute);letter-spacing:.1em;margin-top:4px}
.wsub{font-size:12px;color:var(--mute);margin-top:4px}
.barsvg{width:100%;max-width:420px;display:block;margin:4px auto 0}
.barlbl{font-size:15px;color:var(--soft);cursor:pointer;margin-top:-6px}
.plates{display:flex;justify-content:center;align-items:center;gap:10px;margin:18px 10px 0;flex-wrap:wrap}
.oct{position:relative;display:block}
.oct svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 6px rgba(var(--cyr),.35))}
.badge{position:absolute;right:-2px;bottom:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--pk);color:var(--on-pk);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.hint{font-size:11px;color:var(--mute);margin-top:10px}
.repsrow{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:26px}
.cbtn{width:56px;height:56px;border-radius:50%;border:2px solid var(--cy);color:var(--cy);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(var(--cyr),.25)}
.cbtn .i{width:24px;height:24px}
.rnum{font-size:66px;font-weight:200;line-height:1;min-width:90px;cursor:pointer}
.navrow{display:flex;align-items:center;justify-content:space-between;padding:0 34px;margin-top:30px}
.navrow .dbl{width:56px;height:56px;color:var(--pk);display:flex;align-items:center;justify-content:center}
.navrow .dbl .i{width:40px;height:40px}
.rtb{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--cy);font-size:11px;letter-spacing:.06em}
.rtb .i{width:30px;height:30px}
.rtb.run{color:var(--pk);font-size:20px;font-weight:600;letter-spacing:0}
.lw{margin-top:30px;text-align:left;border-top:1px solid var(--line)}
.lwh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.lwh b{font-size:18px}.lwh span{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.lwh .i{width:18px;height:18px}
.ovbar{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:8;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + var(--sab));background:var(--bar2);cursor:pointer}
.ovbar .i{width:34px;height:34px;color:var(--pk)}
.ovbar .g{flex:1}.ovbar .g div:last-child{font-size:13px;color:var(--mute)}
.modal{position:absolute;inset:0;z-index:40;background:var(--modal);display:flex;align-items:center;justify-content:center;padding:20px}
.tcard{position:relative;width:100%;max-width:360px;background:linear-gradient(180deg,var(--tc1),var(--tc2));border-radius:10px;overflow:hidden;text-align:center;padding-top:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tcard .x{position:absolute;right:10px;top:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff}
.tcard h3{margin:0;font-size:17px;font-weight:600}
.ring{position:relative;width:200px;height:200px;margin:26px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:300;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.adj{display:flex;margin:10px 0 22px}.adj button{flex:1;font-size:28px;font-weight:300;padding:10px}.adj button small{font-size:12px;color:var(--mute)}
.adj button:first-child{border-right:1px solid var(--line)}
.tcard .pkb{margin:0;width:100%;border-radius:0}
.calcscr{position:absolute;inset:0;z-index:45;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.calcscr .bgfx{position:absolute}
.cin{display:flex;background:rgba(var(--deepr),.6)}
.cin label{flex:1;display:flex;align-items:center;gap:10px;padding:20px 16px;color:var(--mute);font-size:13px;letter-spacing:.05em}
.cin label:first-child{border-right:1px solid var(--line)}
.cin input{flex:1;min-width:0;background:none;border:0;color:#fff;font-size:22px;outline:none}
.cin .i{color:var(--pk)}
.crows{flex:1;overflow:auto}
.crow{display:flex;padding:15px 0;border-bottom:1px solid var(--line);font-size:16px}
.crow span{flex:1;text-align:center}.crow span:last-child{color:var(--soft)}
.calcscr .pkb{margin:12px 20px calc(16px + var(--sab))}
.setpanel{position:absolute;inset:0;z-index:20;max-width:520px;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,var(--top) 0%,var(--mid) 45%,var(--bot) 100%);box-shadow:0 -10px 40px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
.setpanel.enter{animation:slideUp .34s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.grab2{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:4px auto 0}
.ovbar.ins{bottom:calc(64px + var(--sab));padding-bottom:12px}
.push{animation:pushIn .26s cubic-bezier(.2,.8,.2,1)}
.pop{animation:popIn .26s cubic-bezier(.2,.8,.2,1)}
.fade{animation:fadeIn .2s ease}
@keyframes pushIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.setmain{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(18px + var(--sab))}
.setscr .mid{flex:1 0 auto;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(10px,2vh,24px);padding:clamp(6px,1.5vh,16px) 0}
.setscr .exn{font-size:clamp(22px,3.4vh,30px);font-weight:700;line-height:1.15}
.setscr .setl{font-size:clamp(16px,2.4vh,20px);margin-top:6px}
.setscr .wnum{font-size:clamp(58px,10vh,108px);font-weight:200;margin-top:0;line-height:.95}
.setscr .wunit{font-size:14px;letter-spacing:.14em;margin-top:10px;padding-left:.14em}
.setscr .barsvg{width:100%;height:auto;max-height:clamp(96px,17vh,160px);padding:0 4px}
.bp{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:opacity .22s ease,transform .22s cubic-bezier(.4,0,.2,1)}
.bp:active{opacity:.8}
.bp.out{opacity:0;transform:scaleY(.6)}
.bp.out rect{fill:var(--pkfade)}
.setscr .barlbl{font-size:17px}
.setscr .hint{font-size:11px;margin-top:6px}
.setscr .repsrow{margin-top:0;gap:30px}
.setscr .rnum{font-size:clamp(52px,8.5vh,88px);min-width:120px}
.setscr .cbtn{width:clamp(56px,7.5vh,68px);height:clamp(56px,7.5vh,68px)}.setscr .cbtn .i{width:30px;height:30px}
.setscr .navrow{flex:none;margin-top:4px;padding:0 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.setscr .navrow .dbl:first-child{justify-self:start}.setscr .navrow .dbl:last-child{justify-self:end}
.setscr .navrow .dbl{width:88px;height:72px;border-radius:16px}.setscr .navrow .dbl .i{width:60px;height:60px}
.setscr .navrow .dbl:active,.cbtn:active,.oct:active{transform:scale(.92)}
.setscr .rtb{font-size:12px}.setscr .rtb .i{width:40px;height:40px}.setscr .rtb.run{font-size:26px}
.setscr .plates{flex-wrap:nowrap;gap:8px;margin:8px 0 0;padding:0 14px}
.oct{--b:min(84px,calc((min(100vw,520px) - 20px - 8px * var(--n)) / (var(--n) * .8)),10.5vh);flex:none;width:calc(var(--b) * var(--k));height:calc(var(--b) * var(--k));transition:transform .1s}
.setscr .lw{margin-top:0}
.stick{position:sticky;top:-8px;z-index:2;background:var(--sh1);padding-top:4px;padding-bottom:4px}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(var(--cyr),.45);color:var(--cy);font-size:13px;font-weight:600;text-transform:capitalize;white-space:nowrap}
.chips2 button.on{background:var(--cy);color:var(--on-cy);border-color:var(--cy)}
.secl{padding:18px 20px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pk);border-bottom:1px solid var(--line)}
.letter{padding:8px 20px 4px;font-size:13px;font-weight:700;color:var(--mute);background:rgba(var(--deepr),.35)}
.lblx{font-size:12px;color:var(--mute);margin:12px 2px 6px}
select.inp{-webkit-appearance:none;appearance:none}

/* ===== megan test: components ===== */
.chw{display:flex;flex-wrap:wrap;gap:8px}
.chw button{padding:8px 13px;border-radius:999px;border:1.5px solid rgba(var(--cyr),.35);color:var(--cy);font-size:13px;font-weight:600;text-transform:capitalize;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chw button.on{background:var(--cy);color:var(--on-cy);border-color:var(--cy)}
.bpk button em{font-style:normal;font-size:11px;width:17px;height:17px;border-radius:50%;background:var(--pk);color:#121212;display:flex;align-items:center;justify-content:center;font-weight:800}
.cyl.ghost{color:var(--mute)}
.cyc{display:flex;align-items:center;gap:8px;margin:4px auto 0;padding:7px 12px 7px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--soft)}
.cyc i{width:9px;height:9px;border-radius:50%}.cyc .i{width:14px;height:14px;color:var(--mute)}
.cycn{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.cycn i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}.cycn b{display:block;font-size:14px}.cycn span{display:block;font-size:12px;color:var(--mute);margin-top:2px;line-height:1.4}
.cyins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cyins>div{padding:12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.cyins i{width:10px;height:10px;border-radius:50%;margin-bottom:4px}.cyins b{font-size:15px}.cyins span{font-size:12px;color:var(--mute)}
.gp{padding:6px 20px 4px;text-align:center}
.gpk{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mute)}
.gpr{width:210px;display:block;margin:14px auto 6px}
.gpn{font-size:24px;font-weight:700;margin-top:6px}.gpnx{font-size:13px;color:var(--mute);margin-top:6px}
.gpbar{display:flex;gap:3px;margin:20px 0 4px}.gpbar i{flex:1;height:4px;border-radius:2px;background:var(--line)}.gpbar i.dn{background:var(--pk);opacity:.5}.gpbar i.on{background:var(--pk)}
.gpbt{display:flex;gap:8px;margin-top:16px}.gpbt button{margin:0!important;width:auto!important;flex:1}

/* ===== tool drawer ===== */
.srch{margin:14px 16px 0;padding:0 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;gap:8px;align-items:center;color:var(--mute)}
.srch input{flex:1;background:none;border:0;outline:none;color:var(--text);font-size:16px;padding:11px 0}
.tfil{padding-top:12px}
.tsec{padding-bottom:10px}
.tpins{display:flex;gap:10px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tpin{flex:none;width:116px;min-height:112px;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);position:relative}

.tpin.w{background:#f4f4f5;color:#121212;border-color:transparent}.tpin.w span{color:#55555c}
.tpin em{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 6px;padding:2px 12px 10px}
.tdr{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;text-align:center;color:var(--soft);position:relative;line-height:1.2}
.tdr .ic{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;position:relative}
.tdr .ic .i{width:26px;height:26px}
.ic.y{background:var(--pk);color:#121212}.ic.w{background:#f4f4f5;color:#121212}.ic.d{background:rgba(255,214,10,.14);color:var(--pk)}.ic.n{background:rgba(var(--cyr),.1);color:var(--cy)}
html[data-theme="light"] .ic.w{background:#18181b;color:#fff}html[data-theme="light"] .ic.d{background:#fff0a3!important;color:#4d3d00!important}html[data-theme="light"] .tpin.w{background:#18181b;color:#fff}html[data-theme="light"] .tpin.w span{color:#a1a1aa}
.tdr .ic em{position:absolute;top:-6px;right:-6px;font-style:normal;font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--sh1);border:1.5px solid var(--cy);color:var(--cy);display:flex;align-items:center;justify-content:center;font-weight:800}
.tdr .ic em.on{background:var(--pk);border-color:var(--pk);color:#121212}
.tdr .dot{position:absolute;top:-2px;right:calc(50% - 33px);width:10px;height:10px;border-radius:50%;background:var(--pk);border:2px solid var(--bot)}
/* new tools */
.hrz{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.hrz>b{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#121212;font-size:14px;flex:none}
.hrz>span{font-size:16px;font-weight:600;white-space:nowrap}
.hrbar{position:relative;height:5px;border-radius:3px;background:var(--line);margin-top:8px}.hrbar i{position:absolute;top:0;bottom:0;border-radius:3px}
.rwk{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:16px 16px 0}
.rwk button{padding:9px 0 8px;border-radius:10px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.rwk button b{font-size:12px}.rwk button span{display:flex;gap:2px}.rwk button i{width:5px;height:5px;border-radius:50%;background:var(--line)}.rwk button i.f{background:var(--pk)}
.rwk button.on{border-color:var(--cy)}.rwk button.dn b{color:var(--pk)}
.chw button em.bn{font-style:normal;font-size:11px;width:17px;height:17px;border-radius:50%;background:var(--pk);color:#121212;display:flex;align-items:center;justify-content:center;font-weight:800}
.flst{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 20px;border-bottom:1px solid var(--line)}
.flst .inp{flex:1;padding:9px 10px}.flst .stp span{min-width:38px;font-size:14px}
.brw{position:relative;width:260px;height:260px;margin:26px auto 22px;display:flex;align-items:center;justify-content:center}
.brc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.55),rgba(255,214,10,.12) 70%);border:2px solid var(--pk);transform:scale(.5);will-change:transform}
.brl{position:relative;text-align:center}.brl b{display:block;font-size:22px}.brl span{display:block;font-size:12px;color:var(--soft);margin-top:4px}
.clt{width:64px;flex:none;font-size:13px;font-weight:700;color:var(--soft)}
.cday{padding:14px 20px 4px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mute)}
.pkb.sm2{margin:0;width:auto;padding:9px 16px;font-size:12px}

.tpins{display:grid!important;overflow:visible!important}
.tpin{width:auto!important;background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--line)!important;user-select:none;-webkit-user-select:none}
.tpin span{color:var(--mute)!important}
.tpin .tpi{width:34px;height:34px;border-radius:10px;background:var(--pk);color:#121212!important;display:flex;align-items:center;justify-content:center}
.tpins.ed .tpin{-webkit-touch-callout:none;border:1.5px dashed rgba(255,214,10,.6)!important;cursor:grab}
.tpin.drag{z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:none}
.ic.g{background:rgba(var(--cyr),.08);color:var(--pk)}
html[data-theme="light"] .ic.g{background:#fff;color:#18181b;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tpins.n4 .tpin{min-height:96px;padding:10px}.tpins.n4 .tpin>span:not(.tpi){display:none}.tpins.n4 .tpin b{font-size:12px}
.tgrid.ed .tdr{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.tdr.drag,.tpin.drag{z-index:5;transition:none!important}.tdr.drag .ic{box-shadow:0 10px 26px rgba(0,0,0,.5)}
.toolscr .barsvg{width:90%!important;max-width:none!important;max-height:clamp(96px,17vh,160px);height:auto;margin:4px auto 0!important;padding:0 4px}
.toolscr .tbody:has(.ptw){display:flex;flex-direction:column}.ptw{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:14px;padding:4px 0 8px;min-height:min-content}.ptw .plates{margin-top:0!important}

/* ===== quick menu v2 ===== */
.shwrap.qpop .sheet{left:10px;right:10px;bottom:calc(104px + var(--sab));border-radius:26px;padding:6px 0 14px;max-height:74vh;transform:scale(.08);opacity:0;transition:transform .42s cubic-bezier(.2,1.22,.32,1),opacity .18s ease;box-shadow:0 20px 60px rgba(0,0,0,.55)}

.qtop{padding:12px 20px 12px}.qlbl{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.qheros{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 10px}
.qh{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;border-radius:18px;min-height:128px;text-align:left}
.qh b{font-size:24px;font-weight:800;margin-top:auto}.qh em{font-style:normal;font-size:12px;opacity:.75;line-height:1.25}

.qh.lift{background:var(--pk);color:#121212}.qh.car{background:#f4f4f5;color:#121212}

.qgrid.qd{padding:0 14px}.qgrid.qd .qtile{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.qtile.drag{z-index:5;transition:none!important;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.shwrap.qpop .qhero{margin:0 14px 10px;width:calc(100% - 28px)}
.sugrow{background:rgba(255,214,10,.08);box-shadow:inset 3px 0 0 var(--pk)}
.gch{padding:4px 16px 12px}
/* home split */
.hsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 16px 12px}
.hsplit button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 14px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:left;min-height:112px;transition:background .2s,color .2s}
.hsplit small{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.7;margin-top:auto}.hsplit b{font-size:26px;font-weight:300}.hsplit em{font-style:normal;font-size:11px;opacity:.65}
.hsplit .hsi{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,214,10,.14);color:var(--pk)}
.hsplit button.on{background:var(--pk);color:#121212;border-color:transparent}.hsplit button.on .hsi{background:rgba(0,0,0,.12);color:#121212}
.upn{margin:0 16px;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.upnt{font-size:22px;font-weight:700;margin:4px 0 2px}

.hrow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 0}

.hrow2 span{color:var(--pk);display:flex}.hrow2 b{display:block;font-size:14px}.hrow2 em{font-style:normal;font-size:11px;color:var(--mute)}
/* tools top */
.tbig{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px 0}
.tbig button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:left}
.tbig .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.tbig b{display:block;font-size:16px}.tbig em{font-style:normal;font-size:11px;color:var(--mute)}
/* program builder */
.pgc{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);margin-bottom:8px}
.pgc b{display:block;font-size:15px}.pgc span{font-size:12px;color:var(--mute)}.pgc.on{border-color:var(--pk);background:rgba(255,214,10,.08)}
.pgd{margin:0 16px 10px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.pgd b{display:block;font-size:14px;margin-bottom:6px;color:var(--pk)}.pgd div{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}.pgd em{font-style:normal;color:var(--mute);white-space:nowrap;margin-left:8px}

function grp(i){const its=S.session.items;let a=i;while(a>0&&its[a-1].sn)a--;let b=i;while(b<its.length-1&&its[b].sn)b++;return [a,b]}
function seqList(){const its=S.session.items,out=[];let i=0;while(i<its.length){const [a,b]=grp(i);const mx=Math.max(...its.slice(a,b+1).map(x=>x.sets.length));for(let r=0;r<mx;r++)for(let k=a;k<=b;k++)if(r<its[k].sets.length)out.push([k,r]);i=b+1}return out}
function seqIdx(){const s=S.session;return seqList().findIndex(a=>a[0]===s.i&&a[1]===s.s)}
function move(d){const s=S.session,L=seqList();const k=Math.max(0,Math.min(L.length-1,seqIdx()+d));if(L[k]){s.i=L[k][0];s.s=L[k][1]}}

function overload(it){const e=ex(it.exId);if(e.type==='cardio'||it.hintDone||it.tw||S.autoProg===false)return null;const last=lastFor(it.exId);if(!last)return null;
  const w=last.sets.filter(x=>!x.wu&&!x.ds&&!x.skip);if(!w.length)return null;const top=Math.max(...w.map(x=>x.w)),atTop=w.filter(x=>x.w===top),minR=Math.min(...atTop.map(x=>x.r));
  let lo,hi;if(it.rr){const p=String(it.rr).split('-').map(Number);lo=p[0]||8;hi=p[1]||lo}else{S.rrMem=S.rrMem||{};let m=S.rrMem[it.exId];if(!m){m=S.rrMem[it.exId]=[minR,minR+(minR<=5?2:minR<=10?4:5)];save()}[lo,hi]=m}
  const work=it.sets.filter(x=>!x.wu&&!x.ds&&!x.done);if(!work.length||work.some(x=>x.w!==top))return null;
  const rirs=atTop.map(x=>x.rir).filter(x=>x!=null);if(top>0&&rirs.length===atTop.length&&Math.min(...rirs)>=3&&minR>=lo&&!atTop.every(x=>x.r>=hi)){const inc=incFor(e.type);return {k:'w',w:Math.round((top+inc)*100)/100,r:lo,txt:`Last time felt easy (3+ reps left). +${fmt(inc)} ${U()} for ${lo}+ reps`}}
  if(atTop.every(x=>x.r>=hi)){if(top===0||e.type==='bodyweight'&&!top)return {k:'r',r:hi+1,txt:`You hit ${hi} on every set. Go for ${hi+1} reps`};const inc=incFor(e.type);return {k:'w',w:Math.round((top+inc)*100)/100,r:lo,txt:`+${fmt(inc)} ${U()} and back to ${lo} reps. You hit ${hi} on every set`}}
  const nr=Math.min(hi,Math.max(lo,minR+1));if(work.every(x=>x.r>=nr))return null;return {k:'r',r:nr,txt:`Go for ${nr} reps. At ${hi} on every set, add weight`}}
function wuPlan(w,t){const b=t==='barbell'?bar():0,inc=t==='barbell'?(U()==='lb'?5:2.5):incFor(t);const r=x=>Math.max(b,Math.round(x/inc)*inc);const out=[];if(t==='barbell'&&w>b)out.push({w:b,r:10});
  const heavy=U()==='lb'?225:100,mid=U()==='lb'?135:60;const pct=w>=heavy?[[.4,8],[.6,5],[.75,3],[.85,1]]:w>=mid?[[.5,6],[.7,3],[.85,1]]:[[.5,8],[.75,4]];
  for(const [p,rp] of pct){const x=r(w*p);if(x>0&&x<w&&x>(out.length?out[out.length-1].w:0))out.push({w:x,r:rp})}return out}

function suggest(list){
  const ctx=V.pf.ctx.map(ex),mc={},pc={},use={};
  ctx.forEach(e=>{if(e.mg)mc[e.mg]=(mc[e.mg]||0)+1;if(e.pat)pc[e.pat]=(pc[e.pat]||0)+1});
  S.history.slice(0,40).forEach(h=>h.entries.forEach(e=>use[e.exId]=(use[e.exId]||0)+1));
  const inCtx=new Set(V.pf.ctx);
  const sc=e=>(pc[e.pat]||0)*1.2+(mc[e.mg]||0)*2+(e.pop?1.5:0)+Math.min(3,use[e.id]||0)*(ctx.length?.6:1.5);
  const ranked=list.filter(e=>!inCtx.has(e.id)).map(e=>[sc(e),e]).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]);
  const out=[],per={};for(const [,e] of ranked){if((per[e.mg]||0)>=2)continue;per[e.mg]=(per[e.mg]||0)+1;out.push(e);if(out.length===5)break}
  const top=Object.entries(pc).sort((a,b)=>b[1]-a[1])[0];

}

/* session */
function octBtn(p,count,act='plate'){
  const mx=PLATES[U()][0],sz=Math.round(46+30*Math.sqrt(p/mx));
  const poly=r=>[...Array(8)].map((_,k)=>{const a=Math.PI/8+k*Math.PI/4;return (50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1)}).join(' ');
  return `<button class="oct" style="--k:${(sz/76).toFixed(3)}" data-a="${act}" data-x="${p}"><svg viewBox="0 0 100 100"><polygon points="${poly(46)}" fill="var(--octbg)" stroke="var(--cy)" stroke-width="4"/><polygon points="${poly(37)}" fill="none" stroke="var(--cy)" stroke-opacity=".45" stroke-width="2.5"/><text x="50" y="58" text-anchor="middle" font-size="${String(p).length>3?20:26}" fill="#fff" font-family="-apple-system,system-ui,sans-serif">${fmt(p)}</text></svg>${count?`<span class="badge">${count}</span>`:''}</button>`;
}
function barSvg(p,tool){
  const Wd=340,H=112,cy=56,mx=PLATES[U()][0];
  const pw=x=>9+7*Math.sqrt(x/mx),ph=x=>34+62*Math.sqrt(x/mx);
  const tot=sum(p.map(x=>pw(x)+2)),sc=tot>102?102/tot:1;
  let g=`<line x1="4" y1="${cy}" x2="${Wd-4}" y2="${cy}" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="108" y="${cy-13}" width="6" height="26" rx="2" fill="#fff"/><rect x="${Wd-114}" y="${cy-13}" width="6" height="26" rx="2" fill="#fff"/><g data-a="${tool?'tbar':'editbar'}" style="cursor:pointer"><rect x="118" y="${cy+8}" width="${Wd-236}" height="40" fill="transparent"/><text x="${Wd/2}" y="${cy+34}" text-anchor="middle" font-size="17" fill="var(--soft)" font-family="-apple-system,system-ui,sans-serif">${fmt(bar())} ${U()}s</text></g>`;

  const ph=day<=c.plen?'men':day<ov-1?'fol':day<=ov+1?'ovu':'lut';return {day,L,ph,late:day>L+3}}

function cycRing(p){const L=p.L,c=CY(),ov=L-14,R=70,cx=90,cy=90,seg=(a,b,col)=>{const a0=(a-1)/L*2*Math.PI-Math.PI/2,a1=b/L*2*Math.PI-Math.PI/2,x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 ${a1-a0>Math.PI?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${col}" stroke-width="12"/>`};
  const dd=Math.min(p.day,L),am=(dd-.5)/L*2*Math.PI-Math.PI/2;
  return `<svg viewBox="0 0 180 180" style="width:180px;display:block;margin:6px auto 0">${seg(1,c.plen,PHASES.men[1])}${seg(c.plen+1,ov-2,PHASES.fol[1])}${seg(ov-1,ov+1,PHASES.ovu[1])}${seg(ov+2,L,PHASES.lut[1])}<circle cx="${(cx+R*Math.cos(am)).toFixed(1)}" cy="${(cy+R*Math.sin(am)).toFixed(1)}" r="10" fill="var(--text)" stroke="var(--sh2)" stroke-width="3"/><text x="90" y="88" text-anchor="middle" font-size="30" font-weight="300" fill="var(--text)">${p.day}</text><text x="90" y="106" text-anchor="middle" font-size="10" fill="var(--mute)">DAY OF ${L}</text></svg>`}
function cycInsights(){const c=CY(),by={men:[],fol:[],ovu:[],lut:[]},sets={men:[0,0],fol:[0,0],ovu:[0,0],lut:[0,0]};
  Object.entries(S.ready||{}).forEach(([k,r])=>{if(!r.score)return;const p=phaseOn(new Date(k+'T12:00').getTime());if(p&&!p.late)by[p.ph].push(r.score)});
  S.history.forEach(h=>{const p=phaseOn(h.date);if(!p||p.late)return;const n=sum(h.entries.map(e=>dn(e).length));if(n){sets[p.ph][0]+=n;sets[p.ph][1]++}});

function applyProg(it){if(S.autoProg===false)return;const E=ex(it.exId);if(!E||E.type==='cardio')return;const last=lastFor(it.exId);if(!last)return;

  if(!it.rr){const topW0=Math.max(...ws.map(x=>x.w)),r0=Math.min(...ws.filter(x=>x.w===topW0).map(x=>x.r));let prev=null,seen=0;for(const h of S.history){const en=h.entries.find(z=>z.exId===it.exId);if(!en)continue;if(++seen===2){prev=en;break}}
    const pw=prev?prev.sets.filter(x=>!x.wu&&!x.ds&&!x.skip):[],pTop=pw.length?Math.max(...pw.map(x=>x.w)):-1,pr=pw.length?Math.min(...pw.filter(x=>x.w===pTop).map(x=>x.r)):0;

    const inc=progInc(E),nw=rnd(topW+inc);it.sets.forEach(x=>{if(!x.wu&&!x.done&&x.w===topW){x.w=nw;x.r=LO;delete x.p}});it.prog={k:'up',m:`You hit ${HI} reps on every set last time. +${fmt(Math.round((nw-topW)*10)/10)} ${U()} today, aim for ${LO}+`}}

function achCheck(silent){const c=achCtx(),got=S.ach=S.ach||{},nw=[];achDefs().forEach(([id,n,d,f])=>{const [v,t]=f(c);if(v>=t&&!got[id]){got[id]=Date.now();nw.push(n)}});if(nw.length){save();if(!silent)setTimeout(()=>{_prT=0;const d=document.createElement('div');d.className='prpop';d.innerHTML=`<div class="prt">${ic('trophy',1.8)}ACHIEVEMENT${nw.length>1?'S':''}</div><div class="prn">${esc(nw[0])}</div><div class="prm">${nw.length>1?'+'+(nw.length-1)+' more unlocked':'Unlocked. See your trophy case in Progress'}</div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)},2600)}return nw}
function achSection(){const c=achCtx(),got=S.ach||{},defs=achDefs();const n=defs.filter(([id])=>got[id]).length;const all=V.achAll;
  const items=defs.map(([id,nm,d,f])=>{const [v,t]=f(c),done=!!got[id]||v>=t;return {id,nm,d,v,t,done}}).sort((a,b)=>(b.done-a.done)||(b.v/b.t-a.v/a.t));
  return `<div class="h2">Trophy Case<small>${n}/${defs.length}</small></div><div class="achg">${(all?items:items.slice(0,9)).map(a=>`<div class="ach ${a.done?'on':''}"><span>${ic('trophy',1.8)}</span><b>${esc(a.nm)}</b><em>${esc(a.d)}</em>${a.done?'':`<i><u style="width:${Math.min(100,a.v/a.t*100)}%"></u></i>`}</div>`).join('')}</div>${defs.length>9?`<button class="lnk sm" data-a="achall" style="display:block;margin:10px auto 0">${all?'SHOW LESS':'SEE ALL '+defs.length}</button>`:''}`}

setTimeout(()=>{try{if(!S.ach){S.ach={};achCheck(true)}}catch(e){}},0);

  const lo=[],hi=[];S.history.forEach(h=>{const r=R[ymd(h.date)];if(!r||!r.score)return;(r.score<=2.6?lo:hi).push(volOf(h))});const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;const diff=lo.length>=2&&hi.length>=2?Math.round((1-avg(lo)/avg(hi))*100):null;

function wtile(id){const e=ex(id),b=bests(id),pts=[];for(let k=S.history.length-1;k>=0;k--){const en=S.history[k].entries.find(x=>x.exId===id);if(en&&dn(en).length)pts.push(Math.max(...dn(en).map(s=>s.w>0?e1(s.w,s.r):s.r)))}

function wDetail(id){const e=ex(id),rows=[];S.history.forEach(h=>{const en=h.entries.find(x=>x.exId===id);if(!en||!dn(en).length)return;const d=dn(en),best=d.reduce((a,x)=>e1(x.w,x.r)>e1(a.w,a.r)?x:a,d[0]);rows.push([h.date,d.length,best,Math.round(e1(best.w,best.r))])});
  const tracked=(S.widgets||[]).includes(id);return `<div class="sh-t">${esc(e.name)}<div class="xs mute" style="font-weight:400;margin-top:2px">${EQN[e.eq]||''}</div></div>${exGuideHtml(e)}<button class="pkb" data-a="addtort" data-x="${id}">${ic('plusc')} Add to a Routine</button>${rows.length?`<div class="secl">Your Progress</div><div class="shp">${widget(id).replace(/<button class="ico" data-a="delwid"[^>]*>.*?<\/button>/,'').replace(/<div class="row"><div style="flex:1;font-weight:600">.*?<\/div><\/div>/,'')}</div>`:''}${rows.length?'<div class="secl">Recent sessions</div>':''}${rows.slice(0,8).map(([t,n,b,o])=>`<div class="li" style="cursor:default"><div class="g"><div class="tt">${dlong(t)}</div><div class="sb">${n} sets · best ${b.w>0?fmt(b.w)+' × '+b.r:b.r+' reps'}</div></div><b class="sm">${b.w>0?fmt(o):''}</b></div>`).join('')}${tracked?`<button class="dng" data-a="delwid" data-x="${id}">Stop tracking on Progress</button>`:''}`}
function insSummary(k){const bw=curBW();if(k==='str'){if(!bw)return 'Log bodyweight';const sx=S.sex==='f'?'f':'m',L=bigLifts().filter(x=>x.b.n).map(x=>liftLevel(x.b.e/bw,STD[sx][x.k]));return L.length?LVL[Math.min(4,Math.floor(L.reduce((a,b)=>a+b,0)/L.length))]+' overall':'No lifts yet'}
  if(k==='yr'){const n=new Set(S.history.filter(h=>h.date>=Date.now()-365*864e5).map(h=>dayStart(h.date))).size;return n+' active days'}

/* ===== routine share links ===== */
function b64u(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(b){b=b.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return decodeURIComponent(escape(atob(b)))}
function routineLink(r){const p={v:1,n:r.name,d:r.days.map(d=>({n:d.name,o:d.notes||undefined,i:d.items.map(it=>{const e=ex(it.exId),lib=LIB.some(l=>l.name===e.name);return [e.name,it.sets,it.rr||'',it.sn?1:0,lib?0:[e.eq||'M',e.mg||'']]})}))};return location.origin+location.pathname+'#r='+b64u(JSON.stringify(p))}
function shareRoutine(id){const r=R(id);if(!r)return;const url=routineLink(r);
  if(navigator.share){navigator.share({title:r.name+' · Bars',text:`Try my "${r.name}" routine in Bars`,url}).catch(()=>{});return}
  if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Link copied')).catch(()=>openSheet(`<div class="sh-t">Routine link</div><div class="shp"><textarea class="inp" rows="4" style="width:100%">${esc(url)}</textarea></div>`));

const BIGM=['quads','hamstrings','glutes','back','chest'];
function recovery(){const f={},now=Date.now();S.history.forEach(h=>{const hrs=(now-h.date)/36e5;if(hrs>120)return;h.entries.forEach(e=>{const m=ex(e.exId).mg;if(!m||m==='cardio')return;const n=dn(e).length;if(!n)return;f[m]=(f[m]||0)+n*Math.exp(-hrs/(BIGM.includes(m)?40:28))})});
  const st={};MGS.filter(m=>m!=='cardio'&&m!=='full body').forEach(m=>{const v=f[m]||0;st[m]=v>=4?'tired':v>=1.5?'rec':'fresh'});return st}
function bestDay(){const r=S.routines.find(x=>x.active);if(!r||!r.days.length)return null;const rc=recovery(),w={fresh:1,rec:.45,tired:0};let best=null;
  r.days.forEach(d=>{let tot=0,sc=0;d.items.forEach(it=>{const m=ex(it.exId).mg;if(!m||!rc[m])return;tot+=it.sets;sc+=it.sets*w[rc[m]]});if(!tot)return;const v=sc/tot+(d.id===nextDay(r)?.05:0);if(!best||v>best.v)best={r,d,v}});return best}
function lastHitH(mg){for(const h of S.history){if(sum(h.entries.filter(e=>ex(e.exId).mg===mg).map(e=>dn(e).length))>=3)return Math.round((Date.now()-h.date)/36e5)}return null}
function recWarn(s){if(S.recWarn===false||s.recOk)return [];const cnt={};s.items.forEach(it=>{const m=ex(it.exId).mg;if(m&&m!=='cardio')cnt[m]=(cnt[m]||0)+it.sets.filter(x=>!x.wu).length});
  return Object.keys(cnt).filter(m=>{if(cnt[m]<2)return false;const need=BIGM.includes(m)?48:36;for(const h of S.history){const hrs=(Date.now()-h.date)/36e5;if(hrs>=need)break;const n=sum(h.entries.filter(e=>ex(e.exId).mg===m).map(e=>dn(e).length));if(n>=3)return true}return false}).sort((a,b)=>cnt[b]-cnt[a])}
function recWarnHtml(ms,then){const s=S.session,b=bestDay(),alt=b&&b.d.id!==s.did&&b.v>.6?b:null,nm=ms.map(m=>m.replace(/^./,c=>c.toUpperCase()));const list=nm.length>1?nm.slice(0,-1).join(', ')+' and '+nm[nm.length-1]:nm[0];
  return `<div class="sh-t">Still recovering<div class="xs mute" style="font-weight:400;margin-top:2px">${esc(list)} ${ms.length>1?'were':'was'} trained hard recently</div></div>
  <div class="shp">${ms.map(m=>{const h=lastHitH(m),need=BIGM.includes(m)?48:36;return `<div class="rcwr"><b>${m.replace(/^./,c=>c.toUpperCase())}</b><span>${h!=null?(h<24?h+' hours ago':Math.round(h/24)+' day'+(Math.round(h/24)>1?'s':'')+' ago'):''} · usually needs ~${need}h</span></div>`}).join('')}
  <p class="sm" style="color:var(--soft);line-height:1.45;margin:12px 0 0">Training a muscle again before it recovers tends to mean weaker sets and slower progress. A lighter session or a different muscle group is usually the better call.</p></div>
  ${alt?`<button class="pkb" data-a="recalt" data-x="${alt.r.id}|${alt.d.id}">Do ${esc(alt.d.name)} Instead</button>`:''}<button class="${alt?'olb':'pkb'}" data-a="recok" data-x="${then}">Train Anyway</button><button class="lnk sm" data-a="close" style="display:block;margin:12px auto 0">CANCEL</button>`}

    openSheet(`<div class="sh-t">Bar weight (${U()})</div><div class="shp"><div class="chw">${ps.map(([w,n])=>`<button class="${bar()===w?'on':''}" data-a="tbarset" data-x="${w}">${n} · ${w}</button>`).join('')}</div><div class="lblx">Custom</div><input id="numin" class="inp big" type="number" inputmode="decimal" value="${bar()}"></div><button class="pkb" data-a="numok">Save</button>`)},
  tbarset:x=>{S.bar[U()]=+x;save();closeSheet();render();toast(`Bar set to ${x} ${U()}`)},
  editbar:()=>numSheet('Bar weight ('+U()+')',bar(),v=>{S.bar[U()]=Math.max(0,v);setW(cur())}),
  ropen:()=>{V.restOpen=true;render()},
  rclose:()=>{V.restOpen=false;render()},
  rgo:()=>{startRest();RS()},
  rstop:()=>{S.session.rest=null;V.restOpen=false;RS()},
  radj:x=>{const s=S.session;if(!s.rest){S.rest=Math.max(15,Math.min(600,S.rest+ +x));RS();return}s.rest.end+= +x*1000;const left=s.rest.end-Date.now();if(left<=0){restDone(false);return}s.rest.total=Math.max(s.rest.total,left);save();tick()},
  // routines
  newroutine:()=>{const r={id:uid(),name:'New Routine',active:false,days:[{id:uid(),name:'Workout A',items:[]}]};S.routines.push(r);save();ACT.sub('routine:'+r.id);V.rEdit=true;render()},
  redit:()=>{V.rEdit=!V.rEdit;render()},
  actr:x=>{const r=R(x),on=!r.active;S.routines.forEach(z=>z.active=false);r.active=on;RS();if(on)toast('Routine activated')},
  addd:x=>{const r=R(x);r.days.push({id:uid(),name:'Workout '+String.fromCharCode(65+r.days.length),items:[]});RS()},
  deld:x=>{const [ri,di]=x.split('|');confirmSheet('Remove this day from the routine?',()=>{const r=R(ri);r.days=r.days.filter(d=>d.id!==di);RS()},'Remove')},
  its:x=>{const [ri,di,ii,d]=x.split('|');const it=D(ri,di).items[+ii];it.sets=Math.max(1,Math.min(12,it.sets+ +d));RS()},
  itmv:x=>{const [ri,di,ii]=x.split('|');const a=D(ri,di).items,k=+ii;if(k>0){[a[k-1],a[k]]=[a[k],a[k-1]];RS()}},
  itdel:x=>{const [ri,di,ii]=x.split('|');D(ri,di).items.splice(+ii,1);RS()},
  itadd:x=>{const [ri,di]=x.split('|');pickExercise(id=>{D(ri,di).items.push({exId:id,sets:3});RS()},D(ri,di).items.map(it=>it.exId))},
  delr:x=>confirmSheet('Delete this routine?',()=>{S.routines=S.routines.filter(r=>r.id!==x);save();ACT.back()},'Delete'),
  delex:x=>confirmSheet('Delete “'+ex(x).name+'” from your exercise library?',()=>{S.exercises=S.exercises.filter(e=>e.id!==x);S.widgets=S.widgets.filter(w=>w!==x);S.routines.forEach(r=>r.days.forEach(d=>d.items=d.items.filter(i=>i.exId!==x)));RS()},'Delete'),
  delh:x=>confirmSheet('Delete this workout from your log?',()=>{S.history=S.history.filter(h=>h.id!==x);save();ACT.back()},'Delete'),
  // goals
  addwid:()=>pickExercise(id=>{if(!S.widgets.includes(id))S.widgets.push(id);RS()}),
  delwid0:x=>{S.widgets=S.widgets.filter(w=>w!==x);RS()},
  // settings
  units:x=>{if(x===U())return;convertAll(x);S.units=x;RS()},
  rest:x=>{S.rest=Math.max(0,Math.min(600,S.rest+ +x));RS()},
  auto:()=>{S.autoRest=!S.autoRest;RS()},
  barw:x=>{S.bar[U()]=Math.max(0,S.bar[U()]+ +x*step());RS()},
  dbm:x=>{S.dbMode=x;RS()},
  export:()=>openSheet(`<div class="sh-t">Backup</div><div class="shp"><p class="sm mute" style="margin-top:0">Copy this text and keep it somewhere safe (Notes, email). Paste it into “Restore from backup” to bring everything back.</p><textarea class="inp" id="bk" rows="6" readonly>${esc(JSON.stringify(S))}</textarea></div><button class="pkb" data-a="copybk">Copy to Clipboard</button>`),
  copybk:()=>{const t=$('#bk').value;const fb=()=>{const b=$('#bk');b.focus();b.select();toast('Select all and copy manually')};try{navigator.clipboard.writeText(t).then(()=>{S.lastBackup=Date.now();save();toast('Backup copied')},fb)}catch(e){fb()}},
  import:()=>openSheet(`<div class="sh-t">Restore from Backup</div><div class="shp"><p class="sm mute" style="margin-top:0">Paste your backup text. This replaces everything currently in the app.</p><textarea class="inp" id="rb" rows="6"></textarea></div><button class="pkb" data-a="dorestore">Restore</button>`),
  dorestore:()=>{try{const o=JSON.parse($('#rb').value);if(!o||!Array.isArray(o.exercises)||!Array.isArray(o.history)||!Array.isArray(o.routines))throw 0;S=o;save();closeSheet();V={tab:'home',sub:null,stack:[],inSession:!!S.session,ov:false,restOpen:false,calc:null};render();toast('Backup restored')}catch(e){toast('That doesn’t look like a valid backup')}},
  reset:()=>confirmSheet('Reset everything? All workouts, routines and settings will be erased.',()=>{S=seed();V={tab:'home',sub:null,stack:[],inSession:false,ov:false,restOpen:false,calc:null};RS()},'Reset'),
};

document.addEventListener('click',e=>{unlockAudio();const el=e.target.closest('[data-a]');if(!el)return;if(Date.now()-(V.dragT||0)<450&&el.closest('.qgrid,.tgrid,.tpins')){e.preventDefault();e.stopPropagation();return}const f=ACT[el.dataset.a];if(f){e.preventDefault();e.stopPropagation();if(S.session&&!S.session.pre&&!/^idle/.test(el.dataset.a))S.session.lastAct=Date.now();const ss=S.session,it0=ss&&ss.items[ss.i],st0=it0&&it0.sets[ss.s],w0=st0?st0.w:null;f(el.dataset.x,el);if(st0&&S.session===ss&&st0.w!==w0&&!st0.wu)carryW(it0,st0,w0)}});
function carryW(it,st,old){const j=it.sets.indexOf(st);let n=0;it.sets.forEach((x,k)=>{if(k>j&&!x.done&&!x.wu&&!x.ds&&(x.w===old||!x.w)){x.w=st.w;delete x.p;n++}});if(n){save();if(V.inSession)render()}}
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.in;if(!k)return;const x=el.dataset.x;
  if(k==='acnote'){V.ac.note=el.value;return}
  if(k==='tsearch'){tsearch(el.value);return}
  if(k==='exq'){exSearch(el.value);return}
  if(k==='bfv'){V.bf[x]=el.value;const o=$('#bfout');if(o)o.innerHTML=bfOut();return}
  if(k==='wuw'){V.wu.w=el.value;const o=$('#wuout');if(o)o.innerHTML=warmOut();return}
  if(k==='clbw'){V.cl.bw=el.value;const o=$('#clout');if(o)o.textContent=calKg()?calOf(V.cl.k,V.cl.min,V.cl.eff):'–';return}
  if(k==='hra'||k==='hrr'){V[k]=el.value;if(k==='hrr'){S.hr={rest:+el.value||0};save()}const o=$('#hrout');if(o)o.innerHTML=hrOut();return}
  if(k==='fen'){V.fe.n=el.value;return}
  if(k==='fesn'){V.fe.steps[+x][0]=el.value;return}
  if(k==='cfn'){V.cf.name=el.value;return}if(k==='cft'){V.cf.time=el.value;return}if(k==='cfw'){V.cf.where=el.value;return}
  if(k==='pfn'){V.pf2.n=el.value;return}if(k==='pfe'){V.pf2.exp=el.value;return}
  if(k==='cycdate')return;
  if(k==='rname'){R(x).name=el.value;save()}
  else if(k==='dname'){const [ri,di]=x.split('|');D(ri,di).name=el.value;save()}
  else if(k==='dnotes'){const [ri,di]=x.split('|');D(ri,di).notes=el.value;save()}
  else if(k==='snote'){S.session.note=el.value;save()}
  else if(k==='name'){S.name=el.value.trim();save()}
  else if(k==='nc'){const c=V.nc,f=el.dataset.x,v=Math.max(0,parseFloat(el.value)||0);c[f]=v;if(f==='kcal'){c.carb=Math.max(0,Math.round((v-c.pro*4-c.fat*9)/4));const ci=$('#nc_carb');if(ci)ci.value=c.carb}else{c.kcal=Math.round(c.pro*4+c.carb*4+c.fat*9);const ki=$('#nc_kcal');if(ki)ki.value=c.kcal}const o=$('#ncout');if(o)o.innerHTML=nutImpactHtml(c,nutRec())}
  else if(k==='sched'){const [rid,wd]=el.dataset.x.split('|'),r=R(rid);r.sched=r.sched||{};if(el.value)r.sched[wd]=el.value;else delete r.sched[wd];save()}
  else if(k==='obwg'){V.wgT=$('#wgT').value;V.wgD=$('#wgD').value;const o=document.createElement('div');o.innerHTML=obHtml();const n=o.querySelector('#obwgo'),c=$('#obwgo');if(n&&c)c.innerHTML=n.innerHTML}
  else if(k==='pcA'||k==='pcB'){V[k]=el.value;cmpLoad();const r=$('#pcr');if(r)r.value=50}
  else if(k==='wgT'||k==='wgD'){V.wgT=$('#wgT').value;V.wgD=$('#wgD').value;const o=document.createElement('div');o.innerHTML=wgHtml();const no=o.querySelector('#wgout'),cur=$('#wgout');if(no&&cur)cur.innerHTML=no.innerHTML;const btns=[...o.querySelectorAll('.pkb,.dng')];const sh=$('#shc');if(sh){sh.querySelectorAll('.pkb,.dng').forEach(b=>b.remove());btns.forEach(b=>sh.appendChild(b))}}
  else if(k==='pfage'){const v=parseInt(el.value);S.profile=Object.assign(P(),{age:v>=13&&v<=100?v:null});save()}
  else if(k==='pfft'||k==='pfin'){const ft=parseInt($('#pfft').value)||0,inch=parseFloat($('#pfin').value)||0,t=ft*12+inch;S.profile=Object.assign(P(),{height:t>=36&&t<=96?t:null});save()}
  else if(k==='pfht'){const v=parseFloat(el.value);S.profile=Object.assign(P(),{height:v>0?v:null});save()}
  else if(k==='pcorm'){V.pc.orm=el.value;const t=$('#pctab');if(t)t.innerHTML=pctTable()}
  else if(k==='rpcalc'){const w=+$('#rpw').value,r=+$('#rpr').value,e=+$('#rpe').value||8,o=$('#rpout');if(w&&r&&o){const m=w/(rpePct(r,e)/100);o.innerHTML=`Estimated 1RM <b style="color:var(--pk);font-size:18px">${fmt(Math.round(m))} ${U()}</b> <button class="lnk sm" data-a="pcfill" data-x="${Math.round(m)}">USE</button>`}}
  else if(k==='cvlb'){const o=$('#cvkg');if(o)o.value=el.value?Math.round(el.value/2.20462*100)/100:''}
  else if(k==='cvkg'){const o=$('#cvlb');if(o)o.value=el.value?Math.round(el.value*2.20462*10)/10:''}
  else if(k==='sbw'){V.sbw=el.value}
  else if(k==='pbtm'){V.pb[x]=el.value}
  else if(k==='pq'){V.pf.q=el.value;$('#pl').innerHTML=pickBody()}
  else if(k==='calc'){V.calc={w:$('#cw').value,r:$('#cr').value};$('#crows').innerHTML=calcRows()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='numin')ACT.numok()});

function tick(){const s=S.session;if(!s)return;try{const it=s.items[s.i],st=it&&it.sets[s.s];if(st&&st.run){const el=cEl(st),c=$('#cdur');if(c)c.textContent=mmss(el);const pc=$('#cpace');if(pc)pc.textContent=paceTxt(el,st.dist)}}catch(e){}const t=mmss((Date.now()-s.start)/1000);const el=$('#el');if(el)el.textContent=t;const e2=$('#el2');if(e2)e2.textContent=t;const e3=$('#el3');if(e3)e3.textContent=t+' elapsed';
  if(s.rest){const left=(s.rest.end-Date.now())/1000;if(left<=0){restDone(true);return}const txt=mmss(Math.ceil(left));const rt=$('#rt');if(rt)rt.textContent=txt;const r2=$('#rt2');if(r2)r2.textContent=txt;const rr=$('#rring');if(rr){const C=2*Math.PI*88;rr.setAttribute('stroke-dashoffset',C*(1-left*1000/s.rest.total))}}}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

(function(){try{if(document.querySelector('link[rel=apple-touch-icon]'))return;const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,180);gr.addColorStop(0,'#14297a');gr.addColorStop(1,'#060920');g.fillStyle=gr;g.fillRect(0,0,180,180);g.fillStyle='#ec3a6e';[[34,114,112],[48,82,84],[62,50,56]].forEach(([x,y,w])=>{g.beginPath();if(g.roundRect)g.roundRect(x,y,w,24,5);else g.rect(x,y,w,24);g.fill()});const u=c.toDataURL();const l=document.createElement('link');l.rel='apple-touch-icon';l.href=u;document.head.appendChild(l);const i=document.createElement('link');i.rel='icon';i.href=u;document.head.appendChild(i)}catch(e){}})();
applyTheme();render();
try{if('serviceWorker' in navigator&&location.protocol==='https:'){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').then(r=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window._rl){window._rl=1;save();location.reload()}})}}catch(e){}
