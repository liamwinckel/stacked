<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stacked">
<meta name="theme-color" content="#151517">
<title>Stacked</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-volt-180.png">
<link rel="icon" href="icon-volt-192.png">
<style>
:root{--top:#14297a;--mid:#0c1750;--bot:#060920;--cy:#5fd0f3;--pk:#ec3a6e;--text:#fff;--mute:#8e9ac6;--line:rgba(255,255,255,.09);--panel:rgba(var(--deepr),.45);--cyr:95,208,243;--pkr:236,58,110;--deepr:5,9,35;--hdr:var(--hdr);--on-pk:#fff;--on-cy:var(--on-cy);--num:var(--num);--soft:var(--soft);--tabbg:var(--tabbg);--sh1:#17307f;--sh2:#0c1648;--bar2:var(--bar2);--tc1:var(--tc1);--tc2:var(--tc2);--octbg:var(--octbg);--tog:var(--tog);--track:var(--track);--cy2:var(--cy2);--pk2:var(--pk2);--av2:var(--av2);--toastc:#0c1648;--pklt:var(--pklt);--pkup:var(--pkup);--pkfade:var(--pkfade);--modal:var(--modal);--shbg:var(--shbg)}
html[data-theme="volt"]{--top:#161618;--mid:#0d0d0f;--bot:#060607;--cy:#f4f4f5;--pk:#ffd60a;--text:#fff;--mute:#8e8e96;--line:rgba(255,255,255,.08);--panel:rgba(255,255,255,.035);--cyr:244,244,245;--pkr:255,214,10;--deepr:0,0,0;--hdr:rgba(34,34,38,.86);--on-pk:#121212;--on-cy:#121212;--num:#fff;--soft:#e4e4e7;--tabbg:#0b0b0c;--sh1:#28282c;--sh2:#161618;--bar2:#1f1f22;--tc1:#2c2c31;--tc2:#18181b;--octbg:rgba(22,22,24,.92);--tog:#3a3a40;--track:#46464e;--cy2:#a1a1aa;--pk2:#ff9f0a;--av2:#ff9f0a;--toastc:#121212;--pklt:#ffe066;--pkup:#ffe066;--pkfade:#ffe680;--modal:rgba(0,0,0,.72);--shbg:rgba(0,0,0,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bot);color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bgfx{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,var(--top) 0%,var(--mid) 45%,var(--bot) 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
input,textarea{font:inherit}
#app{max-width:520px;margin:0 auto;height:100%;position:relative;display:flex;flex-direction:column;min-height:0}
:root{--sab:env(safe-area-inset-bottom);--sat:env(safe-area-inset-top)}
html.sa{--sat:calc(env(safe-area-inset-top) + 36px)}html.fixgap{--sab:max(env(safe-area-inset-bottom),28px)}
html,body{height:var(--fh,100%);overflow:hidden;overscroll-behavior:none}body{position:relative}
#app>.hd{flex:none;position:relative}
#app>main.pg{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.i{width:22px;height:22px;flex:none;vertical-align:middle}
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 12px) 16px 12px;background:var(--bot);border-bottom:1px solid var(--line)}
.sbcover{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top);background:var(--bot);z-index:30;pointer-events:none}
.hd h1{flex:1;text-align:center;margin:0;font-size:17px;font-weight:600}
.hd .st{display:block;font-size:11px;font-weight:600;color:var(--pk);letter-spacing:.06em;margin-top:2px}
.hl,.hr{min-width:70px;display:flex;align-items:center}.hr{justify-content:flex-end}
.lnk{color:var(--cy);font-weight:600;font-size:16px}
.pg{padding-bottom:calc(110px + var(--sab))}
.h2{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;padding:22px 20px 12px;border-bottom:1px solid var(--line)}
.h2 small{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.06em}
.li{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}
.li .g{flex:1;min-width:0}.li .tt{font-size:16px}.li .sb{font-size:12px;color:var(--mute);margin-top:2px}
.li .chev{color:var(--mute)}
.cyl{display:flex;align-items:center;gap:10px;padding:16px 20px;color:var(--cy);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pkb{display:block;width:calc(100% - 40px);margin:22px 20px 0;padding:15px;background:var(--pk);color:var(--on-pk);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;text-align:center}
.olb{display:block;width:calc(100% - 40px);margin:12px 20px 0;padding:14px;border:1.5px solid var(--cy);color:var(--cy);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;text-align:center}
.dng{display:block;margin:22px auto 0;color:var(--pk);font-weight:600;font-size:14px}
.mute{color:var(--mute)}.sm{font-size:14px}.xs{font-size:12px}.center{text-align:center}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--on-pk);background:var(--pk);border-radius:3px;padding:2px 6px;margin-left:8px;vertical-align:2px}
.tagc{font-size:11px;color:var(--mute);margin-left:6px;text-transform:capitalize}
.empty{text-align:center;color:var(--mute);padding:36px 24px}
.greet{display:flex;align-items:center;justify-content:center;gap:12px;font-size:21px;padding:calc(var(--sat) + 18px) 16px 6px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--av2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--on-pk)}
.resume{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:14px 16px;background:rgba(var(--pkr),.16);border:1px solid rgba(var(--pkr),.5);border-radius:8px;cursor:pointer}
.resume b{color:var(--pk);font-size:13px;letter-spacing:.06em}
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:7;max-width:520px;margin:0 auto;display:flex;align-items:flex-end;background:var(--tabbg);border-top:1px solid var(--line);padding:6px 0 calc(6px + var(--sab))}
.tabs>button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;letter-spacing:-.01em;color:var(--mute);padding:4px 0}
.tabs>button.on{color:#fff}
.tabs .fab{width:52px;height:52px;flex:none;margin:0 4px 2px;border-radius:50%;background:var(--pk);color:var(--on-pk);box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.tabs .fab .i{width:28px;height:28px}
.fablogo{width:34px;height:34px;margin-left:4px}
.inp{width:100%;background:rgba(var(--deepr),.55);border:1px solid var(--line);color:#fff;border-radius:6px;padding:12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--cy)}.inp.big{font-size:30px;text-align:center;font-weight:300}
textarea.inp{font-size:12px;font-family:ui-monospace,Menlo,monospace}
.tog{width:50px;height:30px;border-radius:999px;background:var(--tog);position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--pk)}.tog.on::after{background:var(--on-pk)}.tog.on::after{left:23px}
.seg{display:flex;border:1.5px solid var(--cy);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;font-size:13px;font-weight:600;color:var(--cy)}
.seg button.on{background:var(--cy);color:var(--on-cy)}
.stp{display:flex;align-items:center;gap:6px;color:var(--cy)}
.stp button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--cy)}
.stp span{min-width:28px;text-align:center;font-size:17px;color:#fff}
.stp.w span{min-width:66px;font-size:15px}
.ico{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;margin:4px 20px 0}
.stats>div{display:flex;gap:12px;align-items:flex-start;padding:20px 8px}
.stats>div:nth-child(1),.stats>div:nth-child(2){border-bottom:1px dashed rgba(255,255,255,.18)}
.stats>div:nth-child(odd){border-right:1px dashed rgba(255,255,255,.18)}
.stats .i{width:34px;height:34px;color:var(--cy);margin-top:4px}
.stats b{display:block;font-size:36px;font-weight:300;color:var(--num);line-height:1}
.stats b small{font-size:13px;color:var(--mute)}
.stats span{font-size:11px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.wcard{margin:12px 16px 0;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.wcard .row{display:flex;align-items:center}
.ws{display:flex;margin-top:10px}.ws>div{flex:1}.ws b{display:block;font-size:24px;font-weight:300;color:var(--num)}.ws span{font-size:10px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.spark{width:100%;height:70px;margin-top:10px;display:block}
.setrow{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);font-size:15px}
.setrow span:first-child{font-size:12px;color:var(--mute);letter-spacing:.06em}
/* sheets */
.shwrap{position:absolute;inset:0;z-index:50}
.shbg{position:absolute;inset:0;background:var(--shbg);opacity:0;transition:.2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:linear-gradient(180deg,var(--sh1),var(--sh2));border-radius:16px 16px 0 0;padding:8px 0 calc(20px + var(--sab));max-height:86vh;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.shwrap.in .shbg{opacity:1}.shwrap.in .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 10px}
.sh-t{font-weight:700;font-size:18px;padding:6px 20px 12px}
.shp{padding:0 20px}
.plist{max-height:48vh;overflow:auto;border-top:1px solid var(--line);margin-top:10px}
/* session */
.setscr{text-align:center;padding:calc(var(--sat) + 6px) 0 calc(40px + var(--sab))}
.setscr .setmain{margin-top:calc(-6px - var(--sat));padding-top:calc(var(--sat) + 6px)}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px}
.topbar>:first-child{justify-self:start}.topbar>:last-child{justify-self:end}
.topbar button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.topbar .i{width:26px;height:26px}
.exn{font-size:24px;font-weight:600;margin-top:2px;padding:0 16px}
.setl{color:var(--pk);font-weight:700;font-size:16px;letter-spacing:.06em;margin-top:6px}
.done-t{font-size:12px;color:#7ee2a8;margin-top:4px;letter-spacing:.04em}
.done-t u{color:var(--mute);cursor:pointer}
.wnum{font-size:66px;font-weight:200;line-height:1;margin-top:18px;cursor:pointer;letter-spacing:-.01em}
.wunit{font-size:12px;color:var(--mute);letter-spacing:.1em;margin-top:4px}
.wsub{font-size:12px;color:var(--mute);margin-top:4px}
.barsvg{width:100%;max-width:420px;display:block;margin:4px auto 0}
.barlbl{font-size:15px;color:var(--soft);cursor:pointer;margin-top:-6px}
.plates{display:flex;justify-content:center;align-items:center;gap:10px;margin:18px 10px 0;flex-wrap:wrap}
.oct{position:relative;display:block}
.oct svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 6px rgba(var(--cyr),.35))}
.badge{position:absolute;right:-2px;bottom:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--pk);color:var(--on-pk);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.hint{font-size:11px;color:var(--mute);margin-top:10px}
.repsrow{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:26px}
.cbtn{width:56px;height:56px;border-radius:50%;border:2px solid var(--cy);color:var(--cy);display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(var(--cyr),.25)}
.cbtn .i{width:24px;height:24px}
.rnum{font-size:66px;font-weight:200;line-height:1;min-width:90px;cursor:pointer}
.navrow{display:flex;align-items:center;justify-content:space-between;padding:0 34px;margin-top:30px}
.navrow .dbl{width:56px;height:56px;color:var(--pk);display:flex;align-items:center;justify-content:center}
.navrow .dbl .i{width:40px;height:40px}
.rtb{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--cy);font-size:11px;letter-spacing:.06em}
.rtb .i{width:30px;height:30px}
.rtb.run{color:var(--pk);font-size:20px;font-weight:600;letter-spacing:0}
.lw{margin-top:30px;text-align:left;border-top:1px solid var(--line)}
.lwh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.lwh b{font-size:18px}.lwh span{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.lwh .i{width:18px;height:18px}
.ovbar{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:8;display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + var(--sab));background:var(--bar2);cursor:pointer}
.ovbar .i{width:34px;height:34px;color:var(--pk)}
.ovbar .g{flex:1}.ovbar .g div:last-child{font-size:13px;color:var(--mute)}
.modal{position:absolute;inset:0;z-index:40;background:var(--modal);display:flex;align-items:center;justify-content:center;padding:20px}
.tcard{position:relative;width:100%;max-width:360px;background:linear-gradient(180deg,var(--tc1),var(--tc2));border-radius:10px;overflow:hidden;text-align:center;padding-top:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tcard .x{position:absolute;right:10px;top:10px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:#fff}
.tcard h3{margin:0;font-size:17px;font-weight:600}
.ring{position:relative;width:200px;height:200px;margin:26px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:300;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.adj{display:flex;margin:10px 0 22px}.adj button{flex:1;font-size:28px;font-weight:300;padding:10px}.adj button small{font-size:12px;color:var(--mute)}
.adj button:first-child{border-right:1px solid var(--line)}
.tcard .pkb{margin:0;width:100%;border-radius:0}
.calcscr{position:absolute;inset:0;z-index:45;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.calcscr .bgfx{position:absolute}
.cin{display:flex;background:rgba(var(--deepr),.6)}
.cin label{flex:1;display:flex;align-items:center;gap:10px;padding:20px 16px;color:var(--mute);font-size:13px;letter-spacing:.05em}
.cin label:first-child{border-right:1px solid var(--line)}
.cin input{flex:1;min-width:0;background:none;border:0;color:#fff;font-size:22px;outline:none}
.cin .i{color:var(--pk)}
.crows{flex:1;overflow:auto}
.crow{display:flex;padding:15px 0;border-bottom:1px solid var(--line);font-size:16px}
.crow span{flex:1;text-align:center}.crow span:last-child{color:var(--soft)}
.calcscr .pkb{margin:12px 20px calc(16px + var(--sab))}
.setpanel{position:absolute;inset:0;z-index:20;max-width:520px;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,var(--top) 0%,var(--mid) 45%,var(--bot) 100%);box-shadow:0 -10px 40px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
.setpanel.enter{animation:slideUp .34s cubic-bezier(.2,.8,.2,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.grab2{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin:4px auto 0}
.ovbar.ins{bottom:calc(64px + var(--sab));padding-bottom:12px}
.push{animation:pushIn .26s cubic-bezier(.2,.8,.2,1)}
.pop{animation:popIn .26s cubic-bezier(.2,.8,.2,1)}
.fade{animation:fadeIn .2s ease}
@keyframes pushIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.setmain{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(18px + var(--sab))}
.setscr .mid{flex:1 0 auto;display:flex;flex-direction:column;justify-content:space-evenly;gap:clamp(10px,2vh,24px);padding:clamp(6px,1.5vh,16px) 0}
.setscr .exn{font-size:clamp(22px,3.4vh,30px);font-weight:700;line-height:1.15}
.setscr .setl{font-size:clamp(16px,2.4vh,20px);margin-top:6px}
.setscr .wnum{font-size:clamp(58px,10vh,108px);font-weight:200;margin-top:0;line-height:.95}
.setscr .wunit{font-size:14px;letter-spacing:.14em;margin-top:10px;padding-left:.14em}
.setscr .barsvg{width:100%;height:auto;max-height:clamp(96px,17vh,160px);padding:0 4px}
.bp{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:opacity .22s ease,transform .22s cubic-bezier(.4,0,.2,1)}
.bp:active{opacity:.8}
.bp.out{opacity:0;transform:scaleY(.6)}
.bp.out rect{fill:var(--pkfade)}
.setscr .barlbl{font-size:17px}
.setscr .hint{font-size:11px;margin-top:6px}
.setscr .repsrow{margin-top:0;gap:30px}
.setscr .rnum{font-size:clamp(52px,8.5vh,88px);min-width:120px}
.setscr .cbtn{width:clamp(56px,7.5vh,68px);height:clamp(56px,7.5vh,68px)}.setscr .cbtn .i{width:30px;height:30px}
.setscr .navrow{flex:none;margin-top:4px;padding:0 14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.setscr .navrow .dbl:first-child{justify-self:start}.setscr .navrow .dbl:last-child{justify-self:end}
.setscr .navrow .dbl{width:88px;height:72px;border-radius:16px}.setscr .navrow .dbl .i{width:60px;height:60px}
.setscr .navrow .dbl:active,.cbtn:active,.oct:active{transform:scale(.92)}
.setscr .rtb{font-size:12px}.setscr .rtb .i{width:40px;height:40px}.setscr .rtb.run{font-size:26px}
.setscr .plates{flex-wrap:nowrap;gap:8px;margin:8px 0 0;padding:0 14px}
.oct{--b:min(84px,calc((min(100vw,520px) - 20px - 8px * var(--n)) / (var(--n) * .8)),10.5vh);flex:none;width:calc(var(--b) * var(--k));height:calc(var(--b) * var(--k));transition:transform .1s}
.setscr .lw{margin-top:0}
.stick{position:sticky;top:-8px;z-index:2;background:var(--sh1);padding-top:4px;padding-bottom:4px}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips2::-webkit-scrollbar{display:none}
.chips2 button{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(var(--cyr),.45);color:var(--cy);font-size:13px;font-weight:600;text-transform:capitalize;white-space:nowrap}
.chips2 button.on{background:var(--cy);color:var(--on-cy);border-color:var(--cy)}
.secl{padding:18px 20px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pk);border-bottom:1px solid var(--line)}
.letter{padding:8px 20px 4px;font-size:13px;font-weight:700;color:var(--mute);background:rgba(var(--deepr),.35)}
.lblx{font-size:12px;color:var(--mute);margin:12px 2px 6px}
select.inp{-webkit-appearance:none;appearance:none}

function greedy(side){const out=[];let rem=Math.round(side*100)/100;for(const p of (typeof availPlates==='function'?availPlates():PLATES[U()])){while(rem>=p-1e-9){out.push(p);rem=Math.round((rem-p)*100)/100}}return out}

function mkItem(exId,n,sn,rr,tw,tr){const last=lastFor(exId),t=ex(exId).type,sets=[];if(t==='cardio'){const l=last?dn({sets:last.sets})[0]:null;return {exId,sn:!!sn,sets:[{w:0,r:0,dur:0,dist:0,cal:0,lvl:l?l.lvl||0:0,done:false}]}}const wl=last?last.sets.filter(x=>!x.wu):[],ld=wl.filter(x=>!x.skip);for(let j=0;j<n;j++){let ls=wl[j]&&!wl[j].skip?wl[j]:(ld.length?ld[Math.min(j,ld.length-1)]:null);const rlo=rr?parseInt(String(rr)):0;sets.push({w:tw&&tw[j]!=null?tw[j]:(ls?ls.w:(t==='barbell'?bar():0)),r:tr&&tr[j]!=null?tr[j]:(ls&&!tr?ls.r:(rlo||8)),done:false})}return{exId,sets,sn:!!sn,rr}}

const inSS=i=>{const its=S.session.items;return !!(its[i]&&(its[i].sn||(i>0&&its[i-1].sn)))};
function setLabel(it,j){const st=it.sets[j];if(st.wu){const w=it.sets.filter(x=>x.wu);return `WARM-UP ${w.indexOf(st)+1}/${w.length}`}if(st.ds){const d=it.sets.filter(x=>x.ds);return d.length>1?`DROP SET ${d.indexOf(st)+1}`:'DROP SET'}const w=it.sets.filter(x=>!x.wu&&!x.ds);return `SET ${w.indexOf(st)+1}/${w.length}`}
function incFor(t){return t==='dumbbell'&&U()==='kg'?2:step()}
function overload(it){const e=ex(it.exId);if(e.type==='cardio')return null;if(it.hintDone)return null;const last=lastFor(it.exId);if(!last)return null;const w=last.sets.filter(x=>!x.wu);if(w.length<1||w.some(x=>x.skip))return null;
  const top=Math.max(...w.map(x=>x.w));if(w.some(x=>x.w!==top))return null;if(it.rr&&!it.tw){const hi=parseInt(String(it.rr).split('-').pop());if(w.some(x=>x.r<hi))return null}else if(it.tw)return null;else if(w[w.length-1].r<w[0].r-1)return null;
  const work=it.sets.filter(x=>!x.wu&&!x.done);if(!work.length||work.some(x=>x.w!==top))return null;
  if(top===0)return {bw:true,txt:`Hit all ${w.length}×${w[0].r} last time. Go for +1 rep`};
  const inc=incFor(e.type);return {top,inc,txt:`+${fmt(inc)} ${U()}? You hit ${w.length}×${w[0].r} at ${fmt(top)} last time`}}
function wuPlan(w,t){const b=t==='barbell'?bar():0,inc=t==='barbell'?(U()==='lb'?5:2.5):incFor(t);const r=x=>Math.max(b,Math.round(x/inc)*inc);const out=[];if(t==='barbell'&&w>b)out.push({w:b,r:10});
  const heavy=U()==='lb'?225:100,mid=U()==='lb'?135:60;const pct=w>=heavy?[[.4,8],[.6,5],[.75,3],[.85,1]]:w>=mid?[[.5,6],[.7,3],[.85,1]]:[[.5,8],[.75,4]];
  for(const [p,rp] of pct){const x=r(w*p);if(x>0&&x<w&&x>(out.length?out[out.length-1].w:0))out.push({w:x,r:rp})}return out}
function weekStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function prTimeline(exId){const out=[];let be=0;for(let k=S.history.length-1;k>=0;k--){const h=S.history[k],e=h.entries.find(x=>x.exId===exId);if(!e)continue;let best=null;for(const x of dn(e)){const v=x.w>0?e1(x.w,x.r):x.r;if(v>be+.01&&(!best||v>best.v))best={v,w:x.w,r:x.r}}if(best){be=best.v;out.push({date:h.date,...best})}}return out}
function restDone(b){const s=S.session;if(!s||!s.rest)return;s.rest=null;V.restOpen=false;if(b)beep();save();if(V.inSession)render()}
function startRest(){S.session.rest={end:Date.now()+S.rest*1000,total:S.rest*1000}}
function convertAll(to){const f=to==='kg'?1/2.20462:2.20462,r=x=>Math.round(x*f*2)/2,fm=to==='kg'?2.54:1/2.54;(S.body||[]).forEach(b=>{if(b.bw)b.bw=Math.round(b.bw*f*10)/10;['waist','chest','arm','thigh'].forEach(k=>{if(b[k])b[k]=Math.round(b[k]*fm*10)/10})});S.history.forEach(h=>h.entries.forEach(e=>e.sets.forEach(st=>{if(!st.skip)st.w=r(st.w)})));if(S.session)S.session.items.forEach(it=>it.sets.forEach(st=>{st.w=r(st.w);delete st.p}))}

function suggest(list){
  const ctx=V.pf.ctx.map(ex),mc={},pc={},use={};
  ctx.forEach(e=>{if(e.mg)mc[e.mg]=(mc[e.mg]||0)+1;if(e.pat)pc[e.pat]=(pc[e.pat]||0)+1});
  S.history.slice(0,40).forEach(h=>h.entries.forEach(e=>use[e.exId]=(use[e.exId]||0)+1));
  const inCtx=new Set(V.pf.ctx);
  const sc=e=>(pc[e.pat]||0)*1.2+(mc[e.mg]||0)*2+(e.pop?1.5:0)+Math.min(3,use[e.id]||0)*(ctx.length?.6:1.5);
  const ranked=list.filter(e=>!inCtx.has(e.id)).map(e=>[sc(e),e]).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]);
  const out=[],per={};for(const [,e] of ranked){if((per[e.mg]||0)>=2)continue;per[e.mg]=(per[e.mg]||0)+1;out.push(e);if(out.length===5)break}
  const top=Object.entries(pc).sort((a,b)=>b[1]-a[1])[0];
  return {list:out,label:top?`Suggested for your ${top[0]} workout`:'Suggested'};
}

function pickBody(){
  const f=V.pf,q=f.q.toLowerCase().trim();

  const chips=`<div class="chips2">${eqs.map(k=>`<button class="${f.eq===k?'on':''}" data-a="pfeq" data-x="${k}">${k?EQN[k]:'All equipment'}</button>`).join('')}</div><div class="chips2">${['',...MGS].map(m=>`<button class="${f.mg===m?'on':''}" data-a="pfmg" data-x="${m}">${m||'All muscles'}</button>`).join('')}</div>`;

}

function spark(p){if(p.length<2)return '<p class="xs mute" style="margin:10px 0 0">Log this exercise in 2+ workouts to see a trend line.</p>';const Wd=300,H=70,mn=Math.min(...p),mx=Math.max(...p),rg=mx-mn||1;const xy=p.map((v,i)=>[8+i*(Wd-16)/(p.length-1),H-8-(v-mn)/rg*(H-16)]);return `<svg viewBox="0 0 ${Wd} ${H}" class="spark" preserveAspectRatio="none"><polyline points="${xy.map(a=>a.join(',')).join(' ')}" fill="none" stroke="var(--cy)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${xy.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="3" fill="var(--pk)"/>`).join('')}</svg>`}
function widget(id){
  const e=ex(id),b=bests(id),pts=[];

function octBtn(p,count,act='plate'){

  return `<button class="oct" style="--k:${(sz/76).toFixed(3)}" data-a="${act}" data-x="${p}"><svg viewBox="0 0 100 100"><polygon points="${poly(46)}" fill="var(--octbg)" stroke="var(--cy)" stroke-width="4"/><polygon points="${poly(37)}" fill="none" stroke="var(--cy)" stroke-opacity=".45" stroke-width="2.5"/><text x="50" y="58" text-anchor="middle" font-size="${String(p).length>3?20:26}" fill="#fff" font-family="-apple-system,system-ui,sans-serif">${fmt(p)}</text></svg>${count?`<span class="badge">${count}</span>`:''}</button>`;
}
function barSvg(p,tool){
  const Wd=340,H=140,cy=70,mx=PLATES[U()][0];
  const pw=x=>11+9*Math.sqrt(x/mx),ph=x=>46+88*Math.sqrt(x/mx);
  const tot=sum(p.map(x=>pw(x)+2)),sc=tot>102?102/tot:1;
  let g=`<line x1="4" y1="${cy}" x2="${Wd-4}" y2="${cy}" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="108" y="${cy-13}" width="6" height="26" rx="2" fill="#fff"/><rect x="${Wd-114}" y="${cy-13}" width="6" height="26" rx="2" fill="#fff"/><g data-a="${tool?'noop':'editbar'}" style="cursor:pointer"><rect x="118" y="${cy+8}" width="${Wd-236}" height="40" fill="transparent"/><text x="${Wd/2}" y="${cy+34}" text-anchor="middle" font-size="17" fill="var(--soft)" font-family="-apple-system,system-ui,sans-serif">${fmt(bar())} ${U()}s</text></g>`;
  let xr=Wd-106,xl=106;
  p.forEach((x,k)=>{const w=pw(x)*sc,h=ph(x);
    g+=`<g data-a="${tool?'tprm':'rmplate'}" data-x="${k}" class="bp"><rect x="${xr-1}" y="0" width="${w+2}" height="${H}" fill="transparent"/><rect x="${xl-w-1}" y="0" width="${w+2}" height="${H}" fill="transparent"/><rect x="${xr}" y="${cy-h/2}" width="${w}" height="${h}" rx="3" fill="var(--cy)"/><rect x="${xl-w}" y="${cy-h/2}" width="${w}" height="${h}" rx="3" fill="var(--cy)"/></g>`;xr+=w+2;xl-=w+2});
  return `<svg class="barsvg" viewBox="0 0 ${Wd} ${H}" style="filter:drop-shadow(0 0 6px rgba(var(--cyr),.5))">${g}</svg>`;
}

function P(){return Object.assign({age:null,height:null,exp:'int',goal:'muscle'},S.profile||{})}

/* ===== coach ===== */
function exTrend(id,n){const out=[];for(const h of S.history){const en=h.entries.find(x=>x.exId===id);if(!en||!dn(en).length)continue;out.push(Math.max(...dn(en).map(x=>x.w>0?e1(x.w,x.r):x.r)));if(out.length===n)break}return out}
function isDeclining(id){const t=exTrend(id,3);return t.length===3&&t[0]<t[1]&&t[1]<t[2]&&t[0]<t[2]*.985}
function isStalled(id){const t=exTrend(id,5);if(t.length<4||isDeclining(id))return false;return Math.max(t[0],t[1],t[2])<=Math.max(...t.slice(3))*1.005}

  else if(k==='dname'){const [ri,di]=x.split('|');D(ri,di).name=el.value;save()}

  else if(k==='snote'){S.session.note=el.value;save()}

  else if(k==='wgT'||k==='wgD'){V.wgT=$('#wgT').value;V.wgD=$('#wgD').value;const o=document.createElement('div');o.innerHTML=wgHtml();const no=o.querySelector('#wgout'),cur=$('#wgout');if(no&&cur)cur.innerHTML=no.innerHTML;const btns=[...o.querySelectorAll('.pkb,.dng')];const sh=$('#shc');if(sh){sh.querySelectorAll('.pkb,.dng').forEach(b=>b.remove());btns.forEach(b=>sh.appendChild(b))}}
  else if(k==='pfage'){const v=parseInt(el.value);S.profile=Object.assign(P(),{age:v>=13&&v<=100?v:null});save()}
  else if(k==='pfft'||k==='pfin'){const ft=parseInt($('#pfft').value)||0,inch=parseFloat($('#pfin').value)||0,t=ft*12+inch;S.profile=Object.assign(P(),{height:t>=36&&t<=96?t:null});save()}
  else if(k==='pfht'){const v=parseFloat(el.value);S.profile=Object.assign(P(),{height:v>0?v:null});save()}
  else if(k==='pcorm'){V.pc.orm=el.value;const t=$('#pctab');if(t)t.innerHTML=pctTable()}
  else if(k==='rpcalc'){const w=+$('#rpw').value,r=+$('#rpr').value,e=+$('#rpe').value||8,o=$('#rpout');if(w&&r&&o){const m=w/(rpePct(r,e)/100);o.innerHTML=`Estimated 1RM <b style="color:var(--pk);font-size:18px">${fmt(Math.round(m))} ${U()}</b> <button class="lnk sm" data-a="pcfill" data-x="${Math.round(m)}">USE</button>`}}
  else if(k==='cvlb'){const o=$('#cvkg');if(o)o.value=el.value?Math.round(el.value/2.20462*100)/100:''}
  else if(k==='cvkg'){const o=$('#cvlb');if(o)o.value=el.value?Math.round(el.value*2.20462*10)/10:''}
  else if(k==='sbw'){V.sbw=el.value}
  else if(k==='pbtm'){V.pb[x]=el.value}
  else if(k==='pq'){V.pf.q=el.value;$('#pl').innerHTML=pickBody()}
  else if(k==='calc'){V.calc={w:$('#cw').value,r:$('#cr').value};$('#crows').innerHTML=calcRows()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='numin')ACT.numok()});

function tick(){const s=S.session;if(!s)return;try{const it=s.items[s.i],st=it&&it.sets[s.s];if(st&&st.run){const el=cEl(st),c=$('#cdur');if(c)c.textContent=mmss(el);const pc=$('#cpace');if(pc)pc.textContent=paceTxt(el,st.dist)}}catch(e){}const t=mmss((Date.now()-s.start)/1000);const el=$('#el');if(el)el.textContent=t;const e2=$('#el2');if(e2)e2.textContent=t;const e3=$('#el3');if(e3)e3.textContent=t+' elapsed';
  if(s.rest){const left=(s.rest.end-Date.now())/1000;if(left<=0){restDone(true);return}const txt=mmss(Math.ceil(left));const rt=$('#rt');if(rt)rt.textContent=txt;const r2=$('#rt2');if(r2)r2.textContent=txt;const rr=$('#rring');if(rr){const C=2*Math.PI*88;rr.setAttribute('stroke-dashoffset',C*(1-left*1000/s.rest.total))}}}
setInterval(tick,250);
